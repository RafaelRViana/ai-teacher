<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Show do Milhão — Pronomes</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    background: radial-gradient(ellipse at top, #123 0%, #04070f 70%);
    color:#f3f3f3; min-height:100vh; padding:14px;
    display:flex; justify-content:center;
  }
  .wrap { width:100%; max-width:900px; }
  h1 { text-align:center; font-size:1.6em; color:#ffd54a; text-shadow:0 0 14px rgba(255,213,74,.55); letter-spacing:1px; }
  .sub { text-align:center; color:#8fb6d9; font-size:.85em; margin:4px 0 16px; }

  .palco { display:grid; grid-template-columns:1fr 220px; gap:14px; }
  @media (max-width:760px){ .palco { grid-template-columns:1fr; } } /* escada vai para baixo da pergunta */

  .painel {
    background:linear-gradient(160deg,#0d1b33,#071021);
    border:2px solid #2f5c8f; border-radius:14px; padding:18px;
    box-shadow:0 0 28px rgba(47,92,143,.35);
  }
  .tags { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tag { background:#1d3a5c; color:#9fd2ff; border-radius:20px; padding:3px 12px; font-size:.75em; }
  .tag.dif { background:#3a2a05; color:#ffd54a; }
  .pergunta { font-size:1.15em; line-height:1.55; min-height:64px; margin-bottom:16px; }
  .pergunta b, .pergunta i { color:#ffd54a; }

  .opcoes { display:grid; gap:9px; }
  .op {
    display:flex; align-items:center; gap:10px; text-align:left;
    font-family:inherit; font-size:1em; padding:11px 13px;
    background:#0f2544; color:#eaf3ff; border:2px solid #2f5c8f;
    border-radius:999px; cursor:pointer; transition:.15s;
  }
  .op:hover:not(:disabled) { background:#1a3a66; transform:translateX(3px); }
  .op .letra { color:#ffd54a; font-weight:bold; min-width:18px; }
  .op:disabled { cursor:default; }
  .op.oculta { visibility:hidden; }
  .op.certa { background:#1c6b3a; border-color:#4ade80; }
  .op.errada { background:#6b1c1c; border-color:#f87171; }

  .ajudas { display:flex; gap:8px; margin:16px 0 10px; flex-wrap:wrap; }
  .ajuda {
    flex:1; min-width:96px; font-family:inherit; font-size:.85em; padding:9px 6px;
    background:#3a2a05; color:#ffd54a; border:2px solid #ffd54a; border-radius:10px; cursor:pointer;
  }
  .ajuda:hover:not(:disabled) { background:#5a4208; }
  .ajuda:disabled { opacity:.3; cursor:default; }
  .parar { width:100%; font-family:inherit; font-size:.9em; padding:10px;
           background:#4a1030; color:#ffb3d1; border:2px solid #ff6fa8; border-radius:10px; cursor:pointer; }
  .parar:hover:not(:disabled) { background:#6a1745; }

  .aviso { background:#132a1a; border-left:4px solid #4ade80; padding:11px 13px;
           border-radius:8px; margin-top:14px; font-size:.92em; line-height:1.5; }
  .aviso.ruim { background:#2a1313; border-left-color:#f87171; }
  .aviso b { color:#ffd54a; }

  .escada { background:linear-gradient(160deg,#0d1b33,#071021); border:2px solid #2f5c8f;
            border-radius:14px; padding:10px; }
  .escada ol { list-style:none; display:flex; flex-direction:column-reverse; }
  .escada li { display:flex; justify-content:space-between; gap:6px; font-size:.8em;
               padding:4px 8px; border-radius:6px; color:#7fa5c9; }
  .escada li .n { opacity:.6; }
  .escada li.check { color:#eaf3ff; font-weight:bold; }
  .escada li.atual { background:#ffd54a; color:#04070f; font-weight:bold; }
  .escada li.feita { color:#4ade80; }

  .placar { text-align:center; font-size:1.05em; color:#ffd54a; margin-bottom:12px; }
  .universitarios { margin-top:14px; font-size:.85em; }
  .barra { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .barra .b { height:14px; background:#4a90d9; border-radius:3px; }
  .final { text-align:center; }
  .final h2 { color:#ffd54a; font-size:1.5em; margin-bottom:8px; }
  .premio { font-size:2em; color:#4ade80; margin:10px 0; }
  .final button { font-family:inherit; font-size:1em; padding:12px 26px; margin-top:12px;
                  background:#ffd54a; color:#04070f; border:none; border-radius:999px;
                  cursor:pointer; font-weight:bold; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 SHOW DO MILHÃO</h1>
  <div class="sub">Rodada especial: PRONOMES — Língua Portuguesa</div>
  <div class="palco">
    <div class="painel" id="painel"></div>
    <div class="escada" id="escada"></div>
  </div>
</div>

<script>
// ============================================================
// BANCO: 8 níveis de dificuldade crescente, 2 perguntas cada.
// Quanto maior o prêmio, mais difícil o nível.
//   t = tema | p = pergunta | a = alternativas (a[0] é SEMPRE a correta) | e = explicação
// ============================================================
const NIVEIS = [
  "Reconhecer",          // 1  — R$ 1.000 / 2.000
  "Classificar",         // 2  — R$ 3.000 / 4.000
  "Átonos e tônicos",    // 3  — R$ 5.000 / 10.000
  "Tratamento",          // 4  — R$ 20.000 / 30.000
  "Colocação",           // 5  — R$ 40.000 / 50.000
  "Transformar frases",  // 6  — R$ 100.000 / 200.000
  "Indefinidos",         // 7  — R$ 300.000 / 400.000
  "Análise fina"         // 8  — R$ 500.000 / 1.000.000
];

const BANCO = [
// ---------- NÍVEL 1 — reconhecimento direto ----------
[
 {t:"Pronomes pessoais", p:"“Eu, tu, ele, nós, vós, eles” são pronomes pessoais do caso...",
  a:["reto","oblíquo átono","oblíquo tônico","de tratamento"],
  e:"Os pronomes do caso <b>reto</b> funcionam como sujeito da oração."},
 {t:"Pronomes possessivos", p:"Qual é o pronome possessivo correspondente à 1ª pessoa do singular?",
  a:["meu(s), minha(s)","teu(s), tua(s)","nosso(s), nossa(s)","seu(s), sua(s)"],
  e:"Eu → <b>meu(s), minha(s)</b>. Tu → teu/tua. Nós → nosso/nossa."},
 {t:"Pronomes de tratamento", p:"“Você”, “Senhor” e “Vossa Excelência” são pronomes de...",
  a:["tratamento","posse","interrogação","dúvida"],
  e:"Pronomes de <b>tratamento</b> servem para se dirigir à outra pessoa conforme a situação, o cargo, o título e a idade."},
 {t:"Tipos de pronomes", p:"“Este, esse, aquele, isto, isso, aquilo” são pronomes...",
  a:["demonstrativos","indefinidos","interrogativos","de tratamento"],
  e:"Pronomes <b>demonstrativos</b> situam um elemento no espaço, no tempo ou no discurso."},
 {t:"Conceito", p:"O que é um pronome?",
  a:["O termo que substitui ou acompanha o substantivo","A palavra que indica ação","A palavra que liga duas orações","A palavra que dá qualidade ao verbo"],
  e:"Pronome é o termo que <b>substitui ou acompanha</b> o substantivo, indicando pessoa do discurso, posse ou posição."},
 {t:"Pronomes pessoais", p:"Qual é a função dos pronomes pessoais?",
  a:["Substituir os substantivos e indicar as pessoas do discurso","Ligar duas orações","Indicar circunstância de tempo","Dar qualidade ao substantivo"],
  e:"Eles <b>substituem os substantivos</b> e indicam quem fala, com quem se fala e de quem se fala."},
 {t:"Pronomes pessoais", p:"Qual pronome do caso reto corresponde à 2ª pessoa do plural?",
  a:["vós","nós","eles","tu"],
  e:"1ª sing. eu · 2ª sing. tu · 3ª sing. ele/ela · 1ª pl. nós · 2ª pl. <b>vós</b> · 3ª pl. eles/elas."},
 {t:"Tipos de pronomes", p:"“Que, o qual, cujo, quem, onde” retomam algo já dito na frase. São pronomes...",
  a:["relativos","interrogativos","possessivos","de tratamento"],
  e:"Pronomes <b>relativos</b> retomam um termo anterior da frase."},
 {t:"Tipos de pronomes", p:"“Qual? Quanto? Quem? Que?” usados em perguntas são pronomes...",
  a:["interrogativos","relativos","demonstrativos","indefinidos"],
  e:"Pronomes <b>interrogativos</b> indicam perguntas diretas ou indiretas."},
 {t:"Pessoas do discurso", p:"A pessoa do discurso “com quem se fala” é a...",
  a:["segunda pessoa (tu, vós)","primeira pessoa (eu, nós)","terceira pessoa (ele, eles)","nenhuma delas"],
  e:"1ª pessoa: quem fala. <b>2ª pessoa: com quem se fala.</b> 3ª pessoa: de quem se fala."}
],
// ---------- NÍVEL 2 — classificação simples ----------
[
 {t:"Pronomes pessoais", p:"Em “Ele <i>me</i> deu um livro”, o pronome “me” é um pronome oblíquo...",
  a:["átono","tônico","reto","possessivo"],
  e:"Oblíquos <b>átonos</b> não vêm acompanhados de preposição: me, te, o, a, lhe, se, nos, vos, os, as, lhes."},
 {t:"Pronomes indefinidos", p:"Em “<i>Ninguém</i> mais se ocupa de mim”, a palavra destacada é um pronome...",
  a:["indefinido","demonstrativo","relativo","possessivo"],
  e:"Pronomes <b>indefinidos</b> se referem à 3ª pessoa de forma vaga ou imprecisa."},
 {t:"Pronomes pessoais", p:"Em “<i>Nós</i> fomos ao cinema”, o pronome “nós” exerce a função de...",
  a:["sujeito","objeto direto","adjunto adnominal","complemento nominal"],
  e:"Quando o pronome pessoal é <b>sujeito</b>, ele é do caso reto."},
 {t:"Pronomes indefinidos", p:"Qual destes pronomes indefinidos é INVARIÁVEL?",
  a:["ninguém","algum","muitas","certos"],
  e:"São invariáveis: algo, alguém, cada, mais, menos, nada, <b>ninguém</b>, outrem, tudo."},
 {t:"Pronomes pessoais", p:"De acordo com a função que exercem, os pronomes pessoais dividem-se em...",
  a:["retos, oblíquos e de tratamento","retos, relativos e possessivos","átonos, tônicos e indefinidos","simples, compostos e mistos"],
  e:"Os pronomes pessoais podem ser <b>retos, oblíquos</b> (átonos ou tônicos) <b>e de tratamento</b>."},
 {t:"Pronomes possessivos", p:"Em “Não deixe <i>sua</i> cadela ir à <i>minha</i> casa!”, os termos destacados são pronomes...",
  a:["possessivos, pois indicam posse","demonstrativos, pois indicam posição","indefinidos, pois são vagos","de tratamento, pois são formais"],
  e:"Pronomes <b>possessivos</b> se referem a uma das três pessoas do discurso para indicar posse."},
 {t:"Pronomes indefinidos", p:"Em “Bastaria esse <i>alguém</i> pegá-la e levá-la”, “alguém” é um pronome indefinido...",
  a:["invariável","variável em gênero","variável em número","variável em gênero e número"],
  e:"“Alguém” não flexiona: é <b>invariável</b>, assim como algo, nada, tudo, ninguém e outrem."},
 {t:"Pronomes pessoais", p:"Qual é o pronome oblíquo átono correspondente a “nós”?",
  a:["nos","conosco","nosso","vos"],
  e:"Átono: <b>nos</b>. Tônico: conosco. “Nosso” é possessivo, não pessoal."},
 {t:"Pronomes demonstrativos", p:"“Este, esta, isto” indicam algo que está...",
  a:["perto de quem fala","perto de quem ouve","distante dos dois","fora do discurso"],
  e:"<b>Este/esta/isto</b> = perto do locutor · esse/essa/isso = perto do interlocutor · aquele/aquela/aquilo = distante dos dois."},
 {t:"Pronomes possessivos", p:"Em “Fafá, não vá mais a <i>essa</i> casa”, o termo destacado indica...",
  a:["posição — é pronome demonstrativo","posse — é pronome possessivo","pessoa — é pronome pessoal","quantidade — é pronome indefinido"],
  e:"“Essa” indica <b>posição</b>: refere-se à casa de Dona Severa, um local. É demonstrativo."}
],
// ---------- NÍVEL 3 — átonos × tônicos ----------
[
 {t:"Oblíquos tônicos", p:"Em “Trouxe essa rosa para <i>ti</i>”, o pronome “ti” é oblíquo...",
  a:["tônico, porque vem acompanhado de preposição","átono, porque é curto","reto, porque é sujeito","de tratamento, porque é formal"],
  e:"Os oblíquos <b>tônicos</b> exigem preposição: mim, comigo, ti, contigo, si, consigo, conosco, convosco."},
 {t:"Oblíquos tônicos", p:"Por que NÃO se diz “com comigo”?",
  a:["Porque a preposição “com” já faz parte da palavra “comigo”","Porque “comigo” é pronome reto","Porque “comigo” é possessivo","Porque “comigo” não aceita preposição nenhuma"],
  e:"Em comigo, contigo, consigo, conosco e convosco a <b>preposição já está incorporada</b> à palavra."},
 {t:"Oblíquos tônicos", p:"Em “A pescaria era uma boa atividade para <i>ele</i>”, o pronome “ele” é...",
  a:["oblíquo tônico, pois é complemento com preposição","reto, pois é sujeito","átono, pois não tem preposição","possessivo, pois indica posse"],
  e:"“Ele/ela/nós/vós” são retos quando são <b>sujeito</b> e oblíquos tônicos quando são <b>complemento com preposição</b>."},
 {t:"Átonos × tônicos", p:"Qual é a diferença entre pronomes oblíquos átonos e tônicos?",
  a:["Os tônicos exigem preposição; os átonos, não","Os átonos são sempre sujeito","Os tônicos só aparecem no plural","Os átonos vêm sempre no fim da frase"],
  e:"Átonos não vêm acompanhados de preposição; <b>tônicos exigem</b> essa partícula."},
 {t:"Oblíquos átonos", p:"Qual alternativa apresenta APENAS pronomes oblíquos átonos?",
  a:["me, te, se, nos","mim, ti, si, conosco","eu, tu, ele, nós","meu, teu, seu, nosso"],
  e:"Átonos: me, te, o, a, lhe, se, nos, vos, os, as, lhes, se."},
 {t:"Oblíquos tônicos", p:"Em “Adoro caminhar <i>contigo</i>”, a palavra “contigo” equivale a...",
  a:["com + tigo (preposição “com”)","contra + tigo","conforme + tigo","com + ti + go"],
  e:"<b>Contigo = com + tigo</b>. Por isso não se usa outra preposição antes."},
 {t:"Oblíquos tônicos", p:"Qual destes pronomes é oblíquo TÔNICO?",
  a:["mim","me","o","lhe"],
  e:"<b>Mim</b> é tônico (para mim, de mim). Me, o e lhe são átonos."},
 {t:"Para mim / para eu", p:"Qual frase está de acordo com a norma-padrão?",
  a:["Ele trouxe um presente para mim.","Ele trouxe um presente para eu.","Ele trouxe um presente para mim ler.","Entre eu e você não há problema."],
  e:"Depois de preposição usa-se <b>mim</b>. Usa-se “eu” quando ele é sujeito de um verbo: “para <b>eu</b> ler”."},
 {t:"Preposições", p:"Qual das palavras a seguir é uma preposição essencial?",
  a:["perante","porque","quando","embora"],
  e:"São preposições essenciais: a, ante, após, até, com, contra, desde, de, em, entre, para, sem, por, <b>perante</b>, sob/sobre, trás."},
 {t:"Oblíquos", p:"Em “Ela pensou <i>consigo</i> mesma que deveria devolver a carteira”, “consigo” é...",
  a:["pronome oblíquo tônico de 3ª pessoa","pronome reto de 3ª pessoa","pronome de tratamento","pronome indefinido"],
  e:"<b>Consigo</b> é oblíquo tônico (com + sigo), referente à 3ª pessoa."}
],
// ---------- NÍVEL 4 — tratamento e pessoa do discurso ----------
[
 {t:"Pronomes de tratamento", p:"Qual pronome de tratamento é usado para o Presidente da República, senadores e deputados?",
  a:["Vossa Excelência","Vossa Magnificência","Vossa Eminência","Vossa Alteza"],
  e:"<b>Vossa Excelência</b> (V. Ex.ª) é usado para pessoas com alta autoridade."},
 {t:"Pronomes de tratamento", p:"“Vossa Magnificência” é o tratamento dirigido a...",
  a:["reitores de universidades","cardeais","reis e rainhas","príncipes e duques"],
  e:"V. Mag.ª → <b>reitores</b>. Cardeais → V. Em.ª. Reis → V. M. Príncipes e duques → V. A."},
 {t:"Pronomes de tratamento", p:"“Vossa Santidade” (V. S.) é o tratamento usado para...",
  a:["o Papa","cardeais","juízes","embaixadores"],
  e:"<b>Vossa Santidade</b> é reservado ao Papa. Para sacerdotes em geral, usa-se Vossa Reverendíssima."},
 {t:"Pronomes de tratamento", p:"Para se dirigir a reis e rainhas, usa-se...",
  a:["Vossa Majestade","Vossa Alteza","Vossa Senhoria","Vossa Eminência"],
  e:"<b>Vossa Majestade</b> (V. M.) → reis e rainhas. Vossa Alteza (V. A.) → príncipes, princesas e duques."},
 {t:"Concordância", p:"Ao usar o pronome de tratamento “você”, a concordância verbal deve ser feita...",
  a:["na 3ª pessoa: “você quer”","na 2ª pessoa: “você queres”","na 1ª pessoa: “você quero”","no plural: “você querem”"],
  e:"Apesar de indicarem a 2ª pessoa do discurso, os pronomes de tratamento levam o verbo para a <b>3ª pessoa</b>."},
 {t:"Concordância", p:"Segundo a norma-padrão, a construção “a gente” deve ser flexionada...",
  a:["no singular: “a gente foi ao cinema”","no plural: “a gente foram ao cinema”","sempre no futuro","sempre acompanhada de “nós”"],
  e:"“A gente” substitui “nós”, mas sua flexão é feita no <b>singular</b>, mesmo indicando mais de uma pessoa."},
 {t:"Abreviaturas", p:"A abreviatura “V. S.ª” corresponde a qual pronome de tratamento?",
  a:["Vossa Senhoria","Vossa Santidade","Vossa Senhora","Vossa Serenidade"],
  e:"<b>Vossa Senhoria</b> (V. S.ª) é empregado em textos escritos, como ofícios e requerimentos."},
 {t:"Mistura de pronomes", p:"Por que “Que bom <i>te</i> ver. O que <i>você</i> faz aqui?” é inadequado em contexto formal?",
  a:["Porque mistura pronomes de 2ª e 3ª pessoas no mesmo texto","Porque “te” não existe na norma-padrão","Porque “você” só pode ser usado por escrito","Porque falta um pronome possessivo"],
  e:"A norma-padrão pede <b>coerência</b>: escolhido “você”, mantém-se “o que <b>lhe</b> trouxe aqui”. Na fala informal a mistura é comum."},
 {t:"Pronomes de tratamento", p:"No quadrinho, o personagem usa “Seu Fernando” para demonstrar respeito. “Seu” é...",
  a:["uma variação informal de “Senhor”","um pronome possessivo","um pronome indefinido","um pronome relativo"],
  e:"“Seu” aqui é <b>variação informal de “Senhor”</b>, um pronome de tratamento."},
 {t:"Pronomes de tratamento", p:"Para substituir “rei dos memes” por um pronome de tratamento adequado, usaríamos...",
  a:["Vossa Majestade","Vossa Excelência","Vossa Magnificência","Vossa Reverendíssima"],
  e:"Reis recebem o tratamento de <b>Vossa Majestade</b>."}
],
// ---------- NÍVEL 5 — colocação pronominal ----------
[
 {t:"Colocação pronominal", p:"Qual frase está de acordo com a norma-padrão?",
  a:["Diga-me a verdade.","Me diga a verdade.","Me diz a verdade.","Me digas a verdade."],
  e:"Não se inicia frase com pronome oblíquo átono: nesses casos o pronome vem <b>depois</b> do verbo (ênclise)."},
 {t:"Colocação pronominal", p:"Em “Não <i>o</i> machuque”, por que o pronome aparece antes do verbo?",
  a:["Porque foi atraído pela palavra negativa “não”","Porque o verbo está no infinitivo","Porque o verbo termina em -r","Porque o sujeito está oculto"],
  e:"<b>Palavras negativas</b> (não, nunca, jamais) atraem o pronome oblíquo átono para antes do verbo."},
 {t:"Colocação pronominal", p:"Em “Eu <i>te</i> levarei ao cinema”, o que atraiu o pronome para antes do verbo?",
  a:["O pronome reto “eu”","O tempo futuro","A vírgula","O sujeito indeterminado"],
  e:"Os oblíquos átonos são atraídos por <b>pronomes retos</b>: “Eu te levarei”, “Ele se chama Antônio”."},
 {t:"Colocação pronominal", p:"Em “Há pessoas que <i>lhe</i> querem bem”, a próclise ocorre por causa...",
  a:["da palavra iniciada por qu- (“que”)","do verbo no infinitivo","do imperativo afirmativo","da ausência de sujeito"],
  e:"Palavras iniciadas por <b>qu-</b> (que, quem, quando) atraem o pronome para antes do verbo."},
 {t:"Colocação pronominal", p:"Com o verbo no imperativo afirmativo, o pronome oblíquo átono deve vir...",
  a:["depois do verbo: “conte-me tudo”","antes do verbo: “me conte tudo”","no meio do verbo","separado por vírgula"],
  e:"No <b>imperativo afirmativo</b> usa-se a ênclise: “Sente aqui e conte-me tudo”, “Convença-me do contrário”."},
 {t:"Colocação pronominal", p:"Com o verbo no infinitivo impessoal, o pronome oblíquo átono...",
  a:["pode vir antes ou depois do verbo","só pode vir depois do verbo","só pode vir antes do verbo","não pode ser usado"],
  e:"“Eu vou lhe contar um segredo” e “Eu vou contar-lhe um segredo”: <b>as duas formas</b> estão corretas."},
 {t:"Colocação pronominal", p:"Em “Nunca <i>se</i> deixe abater”, a próclise é explicada...",
  a:["pela palavra negativa “nunca”","pelo verbo no gerúndio","pela palavra iniciada por qu-","pelo pronome reto anterior"],
  e:"Não, nunca e jamais são <b>palavras negativas</b> e atraem o pronome para antes do verbo."},
 {t:"Colocação pronominal", p:"Em “Me desculpe, rei dos memes”, o problema em relação à norma-padrão é que...",
  a:["não se inicia frase com pronome oblíquo átono","“desculpe” não aceita pronome","“rei” exige Vossa Eminência","o pronome deveria ser possessivo"],
  e:"O correto seria “<b>Desculpe-me</b>”. Em contextos informais, porém, a próclise inicial é comum na fala."},
 {t:"Colocação pronominal", p:"Em “De que <i>se</i> trata esse trabalho?”, a próclise ocorre porque...",
  a:["a frase começa por palavra iniciada com qu-","há palavra negativa","o verbo está no imperativo","há um pronome possessivo"],
  e:"Palavras com <b>qu-</b> (que, quem, quando, quanto) atraem o pronome oblíquo átono."},

const ESCADA = [1000,2000,3000,4000,5000,10000,20000,30000,40000,50000,100000,200000,300000,400000,500000,1000000];
const SEGUROS = [4, 9];                       // paradas garantidas: 5ª e 10ª perguntas
const tierDe = n => Math.floor(n / 2);        // 2 perguntas por nível de dificuldade

const brl = v => "R$ " + v.toLocaleString("pt-BR");
const embaralha = a => a.map(x => [Math.random(), x]).sort((p,q) => p[0]-q[0]).map(p => p[1]);

let nivel, pilhas, atual, ajudas, ocultas, universitarios;

function novoJogo(){
  nivel = 0;
  pilhas = BANCO.map(t => embaralha(t.slice()));   // uma pilha por nível de dificuldade
  ajudas = { cartas:true, universitarios:true, pular:true };
  sorteia();
  render();
}

function sorteia(){
  const q = pilhas[tierDe(nivel)].pop();
  const alts = embaralha(q.a.map((txt,i) => ({txt, certa:i===0})));
  atual = { ...q, alts };
  ocultas = [];
  universitarios = null;
}

// ---------- Ajudas ----------
function usarCartas(){
  ajudas.cartas = false;
  const erradas = atual.alts.map((o,i) => i).filter(i => !atual.alts[i].certa);
  ocultas = embaralha(erradas).slice(0,2);
  render();
}

function usarUniversitarios(){
  ajudas.universitarios = false;
  // quanto mais difícil o nível, menos a turma converge na resposta certa
  const acerto = 90 - tierDe(nivel) * 9;   // nível 1: 90 · nível 8: 27
  const pesos = atual.alts.map((o,i) =>
    ocultas.includes(i) ? 0 : (o.certa ? acerto + Math.random()*20 : 5 + Math.random()*20));
  const soma = pesos.reduce((a,b) => a+b, 0);
  universitarios = pesos.map(p => Math.round(p/soma*100));
  render();
}

function usarPular(){
  ajudas.pular = false;
  sorteia();
  render();
}

// ---------- Fluxo ----------
function responde(i){
  const certa = atual.alts[i].certa;
  document.querySelectorAll(".op").forEach((b, j) => {
    b.disabled = true;
    if (atual.alts[j].certa) b.classList.add("certa");
    else if (j === i) b.classList.add("errada");
  });
  const box = document.createElement("div");
  box.className = "aviso" + (certa ? "" : " ruim");
  box.innerHTML = (certa ? "✅ <b>Acertou!</b> " : "❌ <b>Errou.</b> ") + atual.e;
  document.getElementById("painel").appendChild(box);

  setTimeout(() => {
    if (!certa) return fim(valorSeguro(), false);
    if (nivel === ESCADA.length - 1) return fim(ESCADA[nivel], true);
    nivel++;
    sorteia();
    render();
  }, certa ? 2600 : 4200);
}

function valorSeguro(){
  const passou = SEGUROS.filter(s => nivel > s);
  return passou.length ? ESCADA[passou[passou.length-1]] : 0;
}

function parar(){
  fim(nivel === 0 ? 0 : ESCADA[nivel-1], false);
}

function fim(valor, milhao){
  document.getElementById("painel").innerHTML = `
    <div class="final">
      <h2>${milhao ? "🏆 VOCÊ GANHOU O MILHÃO!" : valor > 0 ? "🎬 Fim de jogo" : "😢 Fim de jogo"}</h2>
      <p>Você chegou à pergunta ${nivel+1} de ${ESCADA.length} — dificuldade ${tierDe(nivel)+1}/8 (${NIVEIS[tierDe(nivel)]}).</p>
      <div class="premio">${brl(valor)}</div>
      <p style="color:#8fb6d9;font-size:.9em">${milhao
        ? "Domínio total dos pronomes. Impressionante!"
        : valor > 0 ? "Você saiu com o prêmio garantido." : "Estude o quadro de pronomes e tente de novo!"}</p>
      <button onclick="novoJogo()">Jogar de novo</button>
    </div>`;
  renderEscada();
}

// ---------- Render ----------
function render(){
  const ultima = nivel === ESCADA.length - 1;
  const dif = tierDe(nivel);
  document.getElementById("painel").innerHTML = `
    <div class="placar">Pergunta ${nivel+1} — valendo ${brl(ESCADA[nivel])}</div>
    <div class="tags">
      <span class="tag dif">${"🔥".repeat(dif+1)} Nível ${dif+1}/8 · ${NIVEIS[dif]}</span>
      <span class="tag">${atual.t}</span>
    </div>
    <div class="pergunta">${atual.p}</div>
    <div class="opcoes">
      ${atual.alts.map((o,i) => `
        <button class="op ${ocultas.includes(i) ? "oculta" : ""}" onclick="responde(${i})">
          <span class="letra">${"ABCD"[i]}</span><span>${o.txt}</span>
        </button>`).join("")}
    </div>
    ${universitarios ? `<div class="universitarios"><b>🎓 Universitários:</b>
      ${atual.alts.map((o,i) => ocultas.includes(i) ? "" : `
        <div class="barra"><span class="letra" style="color:#ffd54a">${"ABCD"[i]}</span>
        <div class="b" style="width:${universitarios[i]*2}px"></div><span>${universitarios[i]}%</span></div>`).join("")}
      </div>` : ""}
    <div class="ajudas">
      <button class="ajuda" onclick="usarCartas()" ${ajudas.cartas && !ultima ? "" : "disabled"}>🃏 Cartas</button>
      <button class="ajuda" onclick="usarUniversitarios()" ${ajudas.universitarios && !ultima ? "" : "disabled"}>🎓 Universitários</button>
      <button class="ajuda" onclick="usarPular()" ${ajudas.pular && !ultima ? "" : "disabled"}>⏭️ Pular</button>
    </div>
    <button class="parar" onclick="parar()" ${nivel === 0 ? "disabled" : ""}>
      🛑 Parar e levar ${brl(nivel === 0 ? 0 : ESCADA[nivel-1])}</button>
    ${ultima ? `<div class="aviso"><b>Pergunta do milhão!</b> Sem ajudas. Se errar, você volta para ${brl(valorSeguro())}.</div>` : ""}`;
  renderEscada();
}

function renderEscada(){
  document.getElementById("escada").innerHTML = "<ol>" + ESCADA.map((v,i) => {
    const cls = i === nivel ? "atual" : i < nivel ? "feita" : SEGUROS.includes(i) ? "check" : "";
    return `<li class="${cls}"><span class="n">${i+1}</span><span>${brl(v)}</span></li>`;
  }).join("") + "</ol>";
}

// ---------- Autoteste: abra com ?test=1 ou rode autoteste() no console ----------
function autoteste(){
  const erros = [];
  const porNivel = Math.max(...ESCADA.map((_,i) => tierDe(i))) + 1;
  if (BANCO.length !== porNivel) erros.push(`o banco precisa de ${porNivel} níveis, tem ${BANCO.length}`);
  if (NIVEIS.length !== BANCO.length) erros.push("NIVEIS não bate com o número de níveis do banco");
  BANCO.forEach((tier, ti) => {
    const usadas = ESCADA.filter((_,i) => tierDe(i) === ti).length;
    if (tier.length < usadas + 3) erros.push(`nível ${ti+1}: ${tier.length} perguntas — pouco para ${usadas} + pular`);
    tier.forEach((q, qi) => {
      if (q.a.length !== 4) erros.push(`nível ${ti+1} q${qi+1}: não tem 4 alternativas`);
      if (new Set(q.a).size !== 4) erros.push(`nível ${ti+1} q${qi+1}: alternativas repetidas`);
      const correta = q.a[0];
      const alts = embaralha(q.a.map((txt,i) => ({txt, certa:i===0})));
      const marcadas = alts.filter(o => o.certa);
      if (marcadas.length !== 1 || marcadas[0].txt !== correta)
        erros.push(`nível ${ti+1} q${qi+1}: embaralhamento perdeu a resposta certa`);
    });
  });
  if (ESCADA.length !== 16) erros.push("a escada deveria ter 16 degraus");
  document.body.innerHTML = `<pre style="padding:20px;font-size:14px;white-space:pre-wrap">${
    erros.length ? "FALHOU:\n" + erros.join("\n")
      : `OK — ${BANCO.length} níveis, ${BANCO.flat().length} perguntas, embaralhamento válido`}</pre>`;
}

if (location.search.includes("test=1")) autoteste(); else novoJogo();
</script>
