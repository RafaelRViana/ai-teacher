<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Potência Quest — Aventura da Matemática</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Potência Quest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink:#ff6b9d;--green:#4ade80;--blue:#60a5fa;--purple:#a78bfa;
  --yellow:#fbbf24;--red:#f87171;--orange:#fb923c;
}
body{
  font-family:'Nunito',sans-serif;
  background:linear-gradient(180deg,#1e1b4b,#312e81,#4338ca);
  min-height:100vh;color:#fff;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
.screen{display:none;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;padding:20px;animation:fadeIn .4s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* INTRO */
#intro{justify-content:center;text-align:center}
.logo{font-size:110px;animation:float 2.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
h1{font-family:'Fredoka One',cursive;font-size:2.1em;margin:8px 0;color:#fbbf24;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
#intro p{max-width:420px;line-height:1.6;margin-bottom:22px;color:#c7d2fe}
.btn{
  font-family:'Fredoka One',cursive;font-size:1.3em;padding:15px 46px;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b2500;
  border:none;border-radius:50px;cursor:pointer;
  box-shadow:0 6px 20px rgba(251,191,36,.4);transition:transform .2s;
}
.btn:hover{transform:scale(1.06)}
.btn:active{transform:scale(.95)}

/* MAP */
#map{gap:14px}
#map h2{font-family:'Fredoka One',cursive;font-size:1.5em;color:#fbbf24;margin-bottom:4px}
.map-container{display:flex;flex-direction:column;gap:12px;max-width:440px;width:100%}
.phase-card{
  width:100%;padding:16px;border-radius:18px;display:flex;align-items:center;gap:14px;
  transition:all .25s;cursor:pointer;background:rgba(255,255,255,.1);border:2px solid transparent;
}
.phase-card.locked{opacity:.45;cursor:not-allowed}
.phase-card.available{background:rgba(255,255,255,.16);border-color:#fbbf24;animation:pulse 2s infinite}
.phase-card.completed{background:rgba(74,222,128,.18);border-color:#4ade80}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 22px rgba(251,191,36,.5)}}
.phase-icon{font-size:42px}
.phase-info{text-align:left;flex:1}
.phase-info h3{font-family:'Fredoka One',cursive;font-size:1.05em}
.phase-info p{font-size:.82em;color:#c7d2fe;margin-top:2px}
.phase-stars{font-size:18px}

/* GAME */
#game{gap:14px}
.hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;
  background:rgba(255,255,255,.1);border-radius:14px;padding:10px 16px;flex-wrap:wrap;gap:8px}
.hud .title{font-family:'Fredoka One',cursive;color:#fbbf24;font-size:.95em}
.hud .lives{font-size:1.1em}
.progress{width:100%;max-width:560px;height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#4ade80,#22c55e);transition:width .3s}
.card{width:100%;max-width:560px;background:rgba(255,255,255,.95);color:#1e1b4b;border-radius:20px;padding:24px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.q-hint{font-size:.85em;color:#6366f1;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.q-text{font-size:1.5em;font-weight:900;margin-bottom:6px;line-height:1.35}
.q-sub{font-size:.9em;color:#555;margin-bottom:18px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{
  font-family:'Nunito',sans-serif;font-size:1.25em;font-weight:800;padding:18px 10px;
  background:#eef2ff;color:#3730a3;border:2px solid #c7d2fe;border-radius:14px;cursor:pointer;transition:transform .12s,background .2s}
.opt:hover{transform:translateY(-2px)}
.opt.correct{background:var(--green);color:#053b16;border-color:#22c55e}
.opt.wrong{background:var(--red);color:#4c0519;border-color:#ef4444}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;font-weight:800;font-size:1.05em;min-height:24px}
.feedback.ok{color:#16a34a}
.feedback.no{color:#dc2626}
.explain{margin-top:6px;font-size:.9em;color:#444;font-weight:600}
.next-btn{margin-top:16px;display:none}
.next-btn.show{display:inline-block}

/* RESULT */
#result{justify-content:center;text-align:center;gap:12px}
.result-emoji{font-size:100px}
#result h2{font-family:'Fredoka One',cursive;font-size:1.8em;color:#fbbf24}
.result-score{font-size:1.3em;font-weight:900}
.star-row{font-size:44px;letter-spacing:4px}
</style>
</head>
<body>

<div id="intro" class="screen active">
  <div class="logo">🚀</div>
  <h1>Potência Quest</h1>
  <p>Ajude o foguete a atravessar a galáxia dos números! Cada planeta é um desafio: potências, cubos, divisores e muito mais. Preparado para a AV1?</p>
  <button class="btn" onclick="showMap()">Começar 🌟</button>
</div>

<div id="map" class="screen">
  <div class="logo" style="font-size:60px">🪐</div>
  <h2>Escolha um planeta</h2>
  <div class="map-container" id="mapContainer"></div>
  <button class="btn" style="font-size:1em;padding:12px 30px;margin-top:8px" onclick="resetProgress()">🔄 Reiniciar tudo</button>
</div>

<div id="game" class="screen">
  <div class="hud">
    <span class="title" id="gameTitle"></span>
    <span class="lives" id="lives"></span>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="card">
    <div class="q-hint" id="qHint"></div>
    <div class="q-text" id="qText"></div>
    <div class="q-sub" id="qSub"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain" id="explain"></div>
    <button class="btn next-btn" id="nextBtn" style="font-size:1em;padding:12px 32px" onclick="nextQuestion()">Continuar ➡️</button>
  </div>
</div>

<div id="result" class="screen">
  <div class="result-emoji" id="resultEmoji">🎉</div>
  <h2 id="resultTitle"></h2>
  <div class="star-row" id="resultStars"></div>
  <div class="result-score" id="resultScore"></div>
  <button class="btn" onclick="showMap()">Voltar ao mapa 🗺️</button>
</div>

<script>

  },
];

// ---------- ESTADO ----------
const SAVE_KEY="potencia-quest-progress";
let progress = load();
let cur = {phase:0, q:0, lives:3, correct:0};

function load(){
  try{ return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; }catch{ return {}; }
}
function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); }

function shuffle(a){ // ponytail: Fisher-Yates, evita alternativa correta sempre na mesma posição
  a=a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ---------- TELAS ----------
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function showMap(){
  const c=document.getElementById('mapContainer'); c.innerHTML='';
  PHASES.forEach((p,i)=>{
    const done = progress[p.id];
    const unlocked = i===0 || progress[PHASES[i-1].id];
    const div=document.createElement('div');
    div.className='phase-card '+(done?'completed':unlocked?'available':'locked');
    const stars = done ? '⭐'.repeat(done.stars)+'☆'.repeat(3-done.stars) : (unlocked?'▶️':'🔒');
    div.innerHTML=`<div class="phase-icon">${p.icon}</div>
      <div class="phase-info"><h3>${i+1}. ${p.name}</h3><p>${p.desc}</p></div>
      <div class="phase-stars">${stars}</div>`;
    if(unlocked) div.onclick=()=>startPhase(i);
    c.appendChild(div);
  });
  show('map');
}

const QUESTIONS_PER_ROUND = 8; // sorteia este tanto do banco a cada partida

function startPhase(i){
  cur={phase:i, q:0, lives:3, correct:0};
  PHASES[i]._order = shuffle(PHASES[i].questions.map((_,k)=>k)).slice(0, QUESTIONS_PER_ROUND);
  document.getElementById('gameTitle').textContent=PHASES[i].icon+' '+PHASES[i].name;
  renderQuestion();
  show('game');
}

function renderQuestion(){
  const p=PHASES[cur.phase];
  const q=p.questions[p._order[cur.q]];
  document.getElementById('lives').textContent='❤️'.repeat(cur.lives)+'🤍'.repeat(3-cur.lives);
  document.getElementById('progressFill').style.width=(cur.q/p._order.length*100)+'%';
  document.getElementById('qHint').textContent=p.name;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('qSub').textContent=q.sub||'';
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('explain').textContent='';
  document.getElementById('nextBtn').classList.remove('show');
  const box=document.getElementById('options'); box.innerHTML='';
  shuffle(q.opts).forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=()=>answer(b,opt,q);
    box.appendChild(b);
  });
}

function answer(btn, opt, q){
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.a) b.classList.add('correct');
  });
  const fb=document.getElementById('feedback');
  if(opt===q.a){
    cur.correct++;
    fb.textContent='✅ Boa!'; fb.className='feedback ok';
  }else{
    btn.classList.add('wrong');
    cur.lives--;
    fb.textContent='❌ Ops!'; fb.className='feedback no';
    document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,cur.lives))+'🤍'.repeat(3-Math.max(0,cur.lives));
  }
  document.getElementById('explain').textContent=q.exp;
  if(cur.lives<=0){ setTimeout(endPhase,900); return; }
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  const p=PHASES[cur.phase];
  cur.q++;
  if(cur.q>=p._order.length){ endPhase(); return; }
  renderQuestion();
}

function endPhase(){
  const p=PHASES[cur.phase];
  const total=p._order.length;
  const stars = cur.lives<=0 ? Math.max(1,Math.round(cur.correct/total*3)) : (cur.correct===total?3:cur.correct>=total*0.6?2:1);
  const passed = cur.lives>0;
  if(passed){
    const prev=progress[p.id]?.stars||0;
    progress[p.id]={stars:Math.max(prev,stars), correct:cur.correct};
    save();
  }
  document.getElementById('resultEmoji').textContent = passed ? (stars===3?'🏆':'🎉') : '💥';
  document.getElementById('resultTitle').textContent = passed ? 'Planeta conquistado!' : 'Foguete sem energia!';
  document.getElementById('resultStars').textContent = passed ? '⭐'.repeat(stars)+'☆'.repeat(3-stars) : 'Tente de novo!';
  document.getElementById('resultScore').textContent = `Acertos: ${cur.correct} de ${total}`;
  show('result');
}

function resetProgress(){
  if(confirm('Apagar todo o progresso?')){ progress={}; save(); showMap(); }
}

// ---------- SELF-CHECK (ponytail: valida que toda pergunta tem sua resposta nas opções) ----------
(function selfCheck(){
  for(const p of PHASES) for(const q of p.questions){
    console.assert(q.opts.includes(q.a), `Resposta ausente nas opções: ${p.id} / "${q.q}"`);
  }
})();
</script>
