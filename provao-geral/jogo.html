{s:'geo',t:'Espaço natural e geográfico',q:'Sobre o espaço natural, é correto afirmar que:',o:['é cada vez mais escasso no planeta','está aumentando a cada ano','só existe nas cidades','nunca existiu'],e:'A ação humana transforma cada vez mais o espaço.'},
{s:'geo',t:'Espaço natural e geográfico',q:'Elementos culturais, sociais ou ANTRÓPICOS são:',o:['os produzidos pelos seres humanos','os produzidos pela natureza','as rochas e o relevo','os rios e as montanhas'],e:'Antrópico = de origem humana.'},
{s:'geo',t:'Espaço natural e geográfico',q:'As três imagens da Antártida no início do capítulo se diferenciam:',o:['pelo nível de interferência dos seres humanos no espaço','pelo clima de cada região','pela estação do ano','pela altitude'],e:'Da natureza inalterada até a base construída.'},
{s:'geo',t:'Espaço natural e geográfico',q:'As transformações do espaço geográfico dependem de:',o:['local, época, sociedade e motivação','apenas do clima','apenas da altitude','somente do dinheiro'],e:'É o esquema apresentado no capítulo.'},
{s:'geo',t:'Espaço natural e geográfico',q:'Tenochtitlán, cidade do México no século XIV, era:',o:['uma cidade asteca bem desenvolvida do ponto de vista estrutural, social e político','uma pequena aldeia sem organização','uma colônia inglesa','uma cidade europeia'],e:'No Império Asteca havia a ideia de produção de riqueza.'},
{s:'geo',t:'Espaço natural e geográfico',q:'Nos Estados Unidos, antes da colonização, os povos originários:',o:['estabeleciam relações mais harmônicas com o meio e pouco transformaram o espaço','construíram grandes metrópoles','destruíram todas as florestas','não existiam'],e:'A transformação rápida veio com a colonização inglesa no século XVII.'},
{s:'geo',t:'Espaço natural e geográfico',q:'No Brasil, os colonizadores portugueses visavam principalmente:',o:['a exploração dos recursos naturais, com devastação de florestas e extração de minerais','o povoamento planejado das cidades','a preservação da natureza','a industrialização imediata'],e:'Isso resultou em desigualdades e pobreza.'},
{s:'geo',t:'Espaço natural e geográfico',q:'A Terra Indígena Vale do Javari, no Amazonas, é onde está:',o:['o maior número de povos isolados do país','a maior cidade da Amazônia','a maior mineradora do Brasil','a nascente do Rio Amazonas'],e:'Área com poucas alterações no espaço geográfico.'},
{s:'geo',t:'Espaço natural e geográfico',q:'O desenvolvimento tecnológico transformou o espaço geográfico porque:',o:['permitiu avanços na agropecuária, na indústria, na construção civil e nos transportes','impediu qualquer mudança','só afetou as áreas rurais','diminuiu as profissões'],e:'A especialização e a diversificação das profissões ampliaram a ação no espaço.'},
{s:'geo',t:'As paisagens',q:'Paisagem é:',o:['tudo o que percebemos de um espaço pela visão e pelos demais sentidos, em determinado momento','apenas o que está escrito nos mapas','somente a vegetação de um lugar','o clima de uma região'],e:'Definição trabalhada a partir de Milton Santos.'},
{s:'geo',t:'As paisagens',q:'Para Milton Santos, a paisagem não é formada só de volumes, mas também de:',o:['cores, movimentos, odores e sons','números e cálculos','leis e normas','datas históricas'],e:'É o domínio do visível, aquilo que a vista abarca.'},
{s:'geo',t:'As paisagens',q:'Paisagem NATURAL é aquela que:',o:['recebeu intervenções mínimas ou nenhuma intervenção humana','foi totalmente construída','só existe nas cidades','tem apenas prédios'],e:'Elementos naturais predominam.'},
{s:'geo',t:'As paisagens',q:'Paisagem CULTURAL (ou antrópica) é aquela que:',o:['reúne elementos naturais e culturais, ou apenas elementos culturais','não tem nenhuma construção','só existe na Antártida','é formada apenas por rochas'],e:'Resulta das alterações humanas.'},
{s:'geo',t:'As paisagens',q:'Uma plantação de eucalipto, mesmo cheia de árvores, é paisagem:',o:['cultural, porque foi produzida pela ação humana','natural, porque tem árvores','sem classificação','natural, porque tem relevo'],e:'É o exemplo de Igaratá (SP) no livro.'},
{s:'geo',t:'As paisagens',q:'As fotos da Praia do Porto da Barra (Salvador-BA) de 1957 e de hoje mostram que:',o:['a paisagem cultural se transforma com o passar do tempo','a paisagem nunca muda','só o clima mudou','a praia deixou de existir'],e:'Os elementos naturais permitem reconhecer que é a mesma área.'},
{s:'geo',t:'As paisagens',q:'O Estádio Mineirão, em Belo Horizonte, é um exemplo de:',o:['permanência: um elemento cultural que se mantém semelhante ao passado','elemento natural','paisagem sem interferência humana','construção destruída pelo tempo'],e:'As permanências representam a cultura e a história das sociedades.'},
{s:'geo',t:'As paisagens',q:'Casarões que viram museus e uma antiga estação de trem que vira shopping em Curitiba mostram que:',o:['elementos da paisagem podem se modificar e adquirir funções diferentes','a paisagem é sempre igual','só se pode demolir o antigo','a história se apaga completamente'],e:'Mudança de função dos elementos culturais.'},
{s:'geo',t:'As paisagens',q:'O bairro da Liberdade, em São Paulo, tem uma paisagem marcada por:',o:['elementos que remetem à cultura asiática, principalmente japonesa','arquitetura indígena','construções da Antiguidade','ruínas romanas'],e:'Arquitetura, decoração, comércio, gastronomia e festividades.'},
{s:'geo',t:'As paisagens',q:'No PRIMEIRO PLANO de uma paisagem estão:',o:['os elementos mais próximos do observador','os elementos mais distantes','apenas o céu','somente construções'],e:'No último plano fica a linha do horizonte.'},
{s:'geo',t:'As paisagens',q:'A LINHA DO HORIZONTE de uma paisagem:',o:['é o último plano, onde estão os elementos mais distantes e sem detalhes claros','fica sempre no primeiro plano','mostra os elementos mais próximos','só existe no mar'],e:'Não é possível ver com clareza os detalhes.'},
{s:'geo',t:'As paisagens',q:'A percepção de uma paisagem muda de acordo com:',o:['o ângulo, a perspectiva, o momento do dia e quem está observando','apenas o tamanho da foto','somente a estação do ano','apenas a altitude'],e:'Exemplo da ilha de Bornholm, na Dinamarca.'},
{s:'geo',t:'As paisagens',q:'Shibuya, em Tóquio, é citada como exemplo de paisagem que:',o:['se transforma à noite, com centenas de letreiros luminosos','nunca muda','é totalmente natural','só existe no inverno'],e:'A iluminação artificial altera a percepção da paisagem.'},
{s:'geo',t:'As paisagens',q:'Imagens de um lixão a céu aberto e de moradias precárias em Mumbai mostram que a paisagem:',o:['revela condições ambientais, políticas, econômicas e sociais do espaço','é sempre bonita','não tem relação com a sociedade','só mostra a natureza'],e:'A leitura da paisagem revela problemas do espaço.'},
{s:'geo',t:'O lugar',q:'Para a Geografia, LUGAR é:',o:['o espaço com o qual temos vínculos afetivos e do qual nos sentimos parte','qualquer ponto do mapa','apenas a cidade onde nascemos','somente o país onde moramos'],e:'Trata-se do espaço que é especial por algum motivo.'},
{s:'geo',t:'O lugar',q:'As três palavras que definem o conceito de lugar são:',o:['pertencimento, afeto e identidade','território, fronteira e Estado','clima, relevo e vegetação','norte, sul e leste'],e:'Esquema do capítulo.'},
{s:'geo',t:'O lugar',q:'Sobre o lugar onde a pessoa nasceu:',o:['nem todo mundo estabelece vínculos afetivos com ele','é sempre o lugar de todos','é obrigatoriamente o lugar preferido','não pode ser mudado'],e:'A pessoa pode considerar outro espaço como seu lugar.'},
{s:'geo',t:'O lugar',q:'São exemplos de espaços que podem ser considerados "meu lugar":',o:['a escola, o bairro, o condomínio e a casa de um familiar','apenas o país','só o planeta Terra','somente o quarto'],e:'O vínculo pode se modificar com o tempo.'},
{s:'geo',t:'Território e fronteira',q:'Território é:',o:['a porção do espaço geográfico onde um povo possui certa autonomia e soberania','qualquer paisagem natural','o mesmo que paisagem','uma área sem donos'],e:'Resultado das ações humanas, da organização política e das relações de poder.'},
{s:'geo',t:'Território e fronteira',q:'Fronteira é:',o:['uma área de transição entre espaços geográficos diferentes','uma linha desenhada no mapa apenas','o centro de um país','um tipo de relevo'],e:'É uma faixa territorial, não apenas uma linha.'},
{s:'geo',t:'Território e fronteira',q:'O LIMITE, dentro de uma fronteira:',o:['separa a faixa territorial e indica onde um território termina e outro começa','é o mesmo que a capital','é uma área de comércio','é sempre invisível'],e:'A fronteira é a faixa; o limite é a separação.'},
{s:'geo',t:'Território e fronteira',q:'O limite pode ser definido por elementos NATURAIS, como:',o:['rios e montanhas','muros e grades','estradas asfaltadas','placas de trânsito'],e:'Os artificiais são estradas, muros ou grades.'},
{s:'geo',t:'Território e fronteira',q:'Estado é:',o:['o conjunto de instituições que organizam e administram o território, regido por leis','o mesmo que nação','apenas o presidente','uma região do país'],e:'A soberania se sustenta por seus órgãos representativos.'},
{s:'geo',t:'Território e fronteira',q:'Os três poderes que constituem os órgãos representativos do Estado são:',o:['Executivo, Legislativo e Judiciário','Militar, Civil e Religioso','Federal, Estadual e Municipal','Político, Econômico e Social'],e:'É o que sustenta a soberania de um povo sobre um território.'},
{s:'geo',t:'Território e fronteira',q:'Nação é:',o:['o povo que compartilha características históricas e culturais e tem identidade cultural comum','o conjunto de leis de um país','o território demarcado','o governo eleito'],e:'Algumas nações reivindicam formar um Estado-nação.'},
{s:'geo',t:'Território e fronteira',q:'Os curdos são um exemplo de:',o:['nação sem Estado ou território definidos','Estado sem povo','território sem fronteira','país reconhecido pela ONU'],e:'Vivem distribuídos em diferentes países do Oriente Médio.'},
{s:'geo',t:'Território e fronteira',q:'O Tibete é:',o:['uma região autônoma da China cuja população reivindica a independência','um país independente reconhecido','uma província do Japão','uma ilha do Pacífico'],e:'Cultura, história e relações internacionais motivam a reivindicação.'},
{s:'geo',t:'Território e fronteira',q:'Sobre a Ucrânia e a Rússia, o livro destaca que:',o:['ambas já integraram a União Soviética, dissolvida em 1991','sempre foram o mesmo país','nunca tiveram relação','são aliadas históricas sem conflitos'],e:'Desde então a Rússia reivindica soberania sobre territórios ucranianos.'},
{s:'geo',t:'Território e fronteira',q:'Na fronteira entre Estados Unidos e México foram instalados muros e grades para:',o:['impedir a entrada ilegal de mexicanos que buscam melhores condições de vida','marcar o clima da região','delimitar reservas naturais','facilitar o comércio'],e:'Exemplo de limite artificial.'},
{s:'geo',t:'Território e fronteira',q:'As Terras Indígenas (TIs) no Brasil são:',o:['áreas ocupadas por etnias indígenas específicas, muitas estabelecidas há séculos','áreas criadas depois de 2020','terras de propriedade de empresas','regiões desabitadas'],e:'A demarcação é uma questão territorial muito debatida.'},
{s:'geo',t:'Território e fronteira',q:'A Terra Indígena Yanomami está localizada principalmente em:',o:['Roraima e Amazonas','São Paulo e Paraná','Bahia e Sergipe','Rio Grande do Sul'],e:'Fica na fronteira norte do Brasil, perto da Venezuela.'},
{s:'geo',t:'Território e fronteira',q:'Brasil e Paraguai são separados pelo:',o:['Rio Paraná, atravessado pela Ponte da Amizade','Rio Amazonas','Oceano Atlântico','Rio São Francisco'],e:'A travessia é considerada tranquila: limite natural sem barreiras.'},

// ================================================================ HISTÓRIA
// --- Cap. 3: O surgimento das primeiras civilizações — Mesopotâmia
{s:'his',t:'Sedentarização',q:'Nômade é o grupo de pessoas que:',o:['não se fixava em um local e vivia migrando em busca de alimentos','morava sempre na mesma cidade','vivia apenas em palácios','não caçava nem plantava'],e:'A sedentarização acabou com esse modo de vida para muitos grupos.'},
{s:'his',t:'Sedentarização',q:'Sedentarizar-se significa:',o:['decidir viver em um lugar fixo','viajar constantemente','abandonar a agricultura','viver isolado'],e:'Foi o que deu origem às aldeias e, depois, às cidades.'},
{s:'his',t:'Sedentarização',q:'O período histórico da sedentarização é chamado de:',o:['Neolítico','Paleolítico','Idade Média','Idade Moderna'],e:'Ocorreu entre 12000 a.C. e 8500 a.C.'},
{s:'his',t:'Sedentarização',q:'Qual critério os grupos seguiram para escolher onde se fixar?',o:['Estar próximo de fontes de água','Ficar longe dos rios','Procurar montanhas altas','Buscar desertos'],e:'Por isso as aldeias surgiram perto dos rios.'},
{s:'his',t:'Sedentarização',q:'A água era fundamental porque servia para:',o:['irrigar o solo, hidratar as pessoas, uso doméstico e abastecimento das aldeias','apenas para banho','somente para transporte','só para pesca'],e:'Água = sobrevivência e produção de alimentos.'},
{s:'his',t:'Sedentarização',q:'A invenção do ARADO permitiu:',o:['o aumento da produção de alimentos, auxiliando na preparação da terra','a construção de navios','a criação da escrita','a domesticação de cavalos'],e:'Instrumento agrícola do Neolítico.'},
{s:'his',t:'Sedentarização',q:'Os celeiros surgiram porque:',o:['os alimentos excedentes precisavam ser armazenados','era preciso guardar armas','serviam de moradia','eram templos religiosos'],e:'A maior disponibilidade de mantimentos deu origem aos celeiros.'},
{s:'his',t:'Sedentarização',q:'A Revolução Agrícola foi:',o:['o processo em que os seres humanos passaram a ter mais controle dos alimentos para sua subsistência','uma guerra por terras','a invenção do trator','o fim da agricultura'],e:'Marca o Neolítico.'},
{s:'his',t:'Sedentarização',q:'O armazenamento de alimentos permitiu que as pessoas:',o:['começassem a trocar a produção excedente, dando origem às primeiras práticas comerciais','parassem de plantar','abandonassem as aldeias','vivessem sozinhas'],e:'Foi a base do comércio como conhecemos hoje.'},
{s:'his',t:'Sedentarização',q:'A divisão do trabalho significou que:',o:['as tarefas foram distribuídas e as pessoas passaram a exercer funções específicas','todos faziam tudo igual','só os reis trabalhavam','o trabalho foi proibido'],e:'Agricultura, criação de animais, artesanato, comércio, etc.'},
{s:'his',t:'Formação das civilizações',q:'Nas primeiras comunidades, quem estabelecia as normas eram:',o:['as pessoas de maior influência, como os mais velhos, os adivinhos, os mais fortes e os grandes proprietários de terras','as crianças','os estrangeiros','ninguém'],e:'Esquema apresentado no capítulo.'},
{s:'his',t:'Formação das civilizações',q:'Uma civilização é formada por:',o:['um grupo que se estabelece em um território e desenvolve valores e características culturais semelhantes','um grupo com fronteiras políticas obrigatoriamente definidas','uma única cidade sempre','uma família apenas'],e:'Pode se estender por grandes regiões e incluir várias cidades.'},
{s:'his',t:'Formação das civilizações',q:'São elementos importantes para a formação de uma civilização:',o:['crença religiosa com sacerdotes, produção artística e sistema de escrita','exército, moeda e bandeira','apenas escrita','apenas religião'],e:'Esses elementos garantem identidade e transmissão de conhecimento.'},
{s:'his',t:'Formação das civilizações',q:'O Crescente Fértil está situado entre:',o:['o Mar Vermelho e o Mar Mediterrâneo','o Atlântico e o Pacífico','o Mar Cáspio e o Mar do Norte','a Índia e a China'],e:'Região onde surgiram as primeiras civilizações.'},
{s:'his',t:'Formação das civilizações',q:'Os rios que fertilizavam o Crescente Fértil eram:',o:['Tigre, Eufrates, Nilo e Jordão','Amazonas e Paraná','Ganges e Indo','Danúbio e Reno'],e:'As cheias periódicas garantiam a fertilidade.'},
{s:'his',t:'Formação das civilizações',q:'O termo "crescente", no Crescente Fértil, faz referência:',o:['ao formato da região, que lembra uma lua crescente','ao crescimento da população','ao aumento do deserto','à colheita crescente'],e:'Além disso, era uma área fertilizada e propícia à agricultura.'},
{s:'his',t:'Formação das civilizações',q:'Civilizações fluviais são aquelas:',o:['dependentes das águas doces dos rios','que vivem no meio do oceano','que não usam água','construídas em montanhas'],e:'Mari, às margens do Eufrates, é um exemplo.'},
{s:'his',t:'Formação das civilizações',q:'A inundação dos rios era importante porque:',o:['depositava uma camada de matéria orgânica que garantia a fertilidade do solo','levava ouro para as cidades','esfriava o clima','afastava os inimigos'],e:'Foi onde a prática agrícola teve origem.'},
{s:'his',t:'A Mesopotâmia',q:'A palavra "Mesopotâmia" significa:',o:['terra entre rios','terra do sol','vale sagrado','deserto fértil'],e:'Referência aos rios Tigre e Eufrates.'},
{s:'his',t:'A Mesopotâmia',q:'A região da Mesopotâmia corresponde hoje a:',o:['grande parte do Iraque e porções da Síria e da Turquia','Egito e Sudão','Grécia e Itália','Índia e Paquistão'],e:'No Oriente Médio.'},
{s:'his',t:'A Mesopotâmia',q:'As primeiras civilizações se formaram na Mesopotâmia há cerca de:',o:['5 000 anos a.C.','500 anos','100 anos','1 000 anos d.C.'],e:'Entre os Rios Tigre e Eufrates.'},
{s:'his',t:'A Mesopotâmia',q:'São legados dos povos mesopotâmicos que ainda afetam nossas vidas:',o:['a escrita, a Astronomia, a Arquitetura e a Matemática','a internet e o rádio','a energia elétrica','a máquina a vapor'],e:'Também o primeiro conjunto de leis escritas.'},
{s:'his',t:'A Mesopotâmia',q:'As cheias dos Rios Tigre e Eufrates ocorriam entre os meses de:',o:['abril e maio','janeiro e fevereiro','agosto e setembro','novembro e dezembro'],e:'Por isso era preciso aprender a dominar as águas.'},
{s:'his',t:'Economia da Mesopotâmia',q:'A base da economia da Mesopotâmia era:',o:['a agricultura, com a maior parte das terras de propriedade do governo','o comércio de escravos apenas','a mineração de ouro','a pesca no mar'],e:'As terras pertenciam majoritariamente ao governo.'},
{s:'his',t:'Economia da Mesopotâmia',q:'Os principais produtos cultivados na Mesopotâmia eram:',o:['a cevada e o trigo, usados na produção de cerveja e pão','o milho e a batata','o café e o cacau','o arroz e a soja'],e:'Também cultivavam sésamo.'},
{s:'his',t:'Economia da Mesopotâmia',q:'O sésamo era cultivado na Mesopotâmia para:',o:['extrair um óleo usado na alimentação e como combustível para iluminação','fazer roupas','construir casas','alimentar apenas animais'],e:'O sésamo produz o gergelim.'},
{s:'his',t:'Economia da Mesopotâmia',q:'Agricultura irrigada é o sistema de cultivo em que:',o:['a água é fornecida de forma artificial, por meio de canais','se planta só na época das chuvas','não se usa água','a água vem apenas da chuva'],e:'Permitiu o plantio em grande escala e gerou excedente.'},
{s:'his',t:'Economia da Mesopotâmia',q:'Além da agricultura, uma atividade econômica importante na Mesopotâmia era:',o:['a domesticação de animais, com criação de cabras, porcos, ovelhas e gado','a criação de elefantes','a pesca oceânica','a fabricação de vidro'],e:'Algumas pessoas passaram a se dedicar ao pastoreio.'},
{s:'his',t:'Economia da Mesopotâmia',q:'As casas mesopotâmicas mais resistentes eram feitas de:',o:['tijolos de argila cozidos e betume','madeira e palha','pedras de mármore','metal e vidro'],e:'O betume é um petróleo natural da região.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'Os sumérios foram responsáveis por:',o:['fundar as primeiras cidades da Mesopotâmia','construir as pirâmides do Egito','inventar a moeda','criar o alfabeto grego'],e:'Algumas das cidades mais antigas do mundo.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'As cidades sumérias mais desenvolvidas eram:',o:['Uruk, Ur, Nipur e Lagash','Atenas, Esparta e Tebas','Roma, Cartago e Pompeia','Menfis, Tebas e Gizé'],e:'Cada uma com governo próprio.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'As cidades sumérias possuíam muralhas para:',o:['proteção contra ataques e invasões inimigas','decorar a paisagem','armazenar grãos','marcar o limite dos rios'],e:'Fora das muralhas ficavam plantações, pomares e hortas.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'O planejamento urbano sumério:',o:['não era amplamente utilizado, resultando em urbanização irregular (exceto templos e palácios)','era perfeito e simétrico em toda a cidade','não existia em lugar nenhum','copiava o modelo egípcio'],e:'Só templos, palácios e áreas adjacentes eram planejados.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'Cidade-Estado significa que cada cidade:',o:['tinha independência política, organização e governantes próprios','era governada por um imperador único','pertencia a outro país','não tinha governo'],e:'Independência em relação às outras cidades-estado.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'Os primeiros governantes das cidades-estado sumérias eram chamados de:',o:['patesi','faraós','césares','xeiques'],e:'Eram sacerdotes que exerciam o governo.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'Entre as funções do patesi estavam:',o:['liderança política, liderança religiosa, gestão econômica local e defesa','apenas cuidar dos templos','somente comandar o exército','apenas cobrar impostos'],e:'A função era multifacetada.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'A famosa estátua de Gudea representa:',o:['um governante da cidade-estado de Lagash','um faraó egípcio','um deus sumério','um escravo'],e:'Escultura em diorito preto, hoje no Museu do Louvre.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'Por volta do segundo milênio a.C., surgiram na Mesopotâmia:',o:['estados maiores governados por reis','repúblicas democráticas','impérios coloniais','tribos nômades apenas'],e:'Disputas políticas e alianças entre cidades-estado.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'Dinastia é:',o:['a família que assumia o poder político, representado pelo palácio','um tipo de templo','um conjunto de leis','uma cidade fortificada'],e:'Os sumérios acreditavam que o poder dos reis vinha dos deuses.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'Mesmo sendo visto como divindade, o poder do rei mesopotâmico:',o:['dependia do apoio dos sacerdotes e do cumprimento de condições religiosas','era absolutamente ilimitado','era eleito pelo povo','durava apenas um ano'],e:'Ele precisava garantir a construção e a decoração dos templos.'},
{s:'his',t:'Sumérios e cidades-Estado',q:'As Liras de Ur são:',o:['instrumentos musicais sumérios encontrados no Cemitério Real, no Iraque','armas de guerra','tábuas com leis','vasos para grãos'],e:'A Lira da Rainha data de 2600 a.C.'},
{s:'his',t:'Sociedade e escravidão',q:'A sociedade mesopotâmica era:',o:['organizada em uma estrutura social rigidamente dividida','totalmente igualitária','formada só por sacerdotes','sem qualquer hierarquia'],e:'Cada camada determinava as funções dos indivíduos.'},
{s:'his',t:'Sociedade e escravidão',q:'A ordem da divisão social suméria, do topo para a base, era:',o:['rei e família, sacerdotes, funcionários públicos, camponeses e escravos','escravos, camponeses e rei','sacerdotes, rei e soldados','camponeses, rei e sacerdotes'],e:'O rei era o comandante da nação.'},
{s:'his',t:'Sociedade e escravidão',q:'Os homens livres da Mesopotâmia, ricos ou pobres:',o:['tinham o direito de possuir bens','não podiam ter propriedades','eram todos sacerdotes','viviam nos templos'],e:'Já os escravos eram considerados propriedade.'},
{s:'his',t:'Sociedade e escravidão',q:'A principal origem da escravidão na Mesopotâmia estava em:',o:['conflitos e guerras: os derrotados eram levados pelos vencedores','castigos religiosos','decisão dos próprios escravos','sorteios anuais'],e:'Tanto um indivíduo quanto um grupo inteiro podiam ser escravizados.'},
{s:'his',t:'Sociedade e escravidão',q:'A escravidão por dívida acontecia quando:',o:['a pessoa se colocava como garantia de um empréstimo e não conseguia pagar','o rei decidia punir alguém','havia uma seca prolongada','o escravo pedia para ser vendido'],e:'Ela se tornava propriedade do credor.'},
{s:'his',t:'Sociedade e escravidão',q:'No festival do Ano Novo na Babilônia, o rei era:',o:['despido dos signos de seu poder e esbofeteado por um sacerdote, recuperando o cargo após jurar não ter tratado mal seus subordinados','coroado novamente com ouro','substituído por um escravo','levado para outra cidade'],e:'Mostra a influência dos sacerdotes sobre o poder real.'},
{s:'his',t:'A invenção da escrita',q:'A escrita surgiu na Mesopotâmia principalmente pela necessidade de:',o:['registrar as atividades financeiras e as trocas comerciais','escrever poesias','desenhar mapas','contar histórias de guerra'],e:'Memorizar todas as trocas tornava-se difícil.'},
{s:'his',t:'A invenção da escrita',q:'A escrita dos sumérios recebeu o nome de cuneiforme porque:',o:['os sinais eram feitos em forma de cunha','usava figuras de animais','era escrita em círculos','tinha formato de cone'],e:'Cuneus = cunha, em latim.'},
{s:'his',t:'A invenção da escrita',q:'A escrita cuneiforme era feita:',o:['com um palito afiado de extremidade triangular em tábuas de argila úmida, secas ao sol','com tinta em papiro','esculpida em ouro','pintada em couro de animais'],e:'Depois as tábuas eram colocadas ao sol para secar.'},
{s:'his',t:'A invenção da escrita',q:'Os primeiros registros da escrita cuneiforme surgiram por volta de:',o:['3000 a.C.','1500 d.C.','500 a.C.','10000 a.C.'],e:'Marco na história da humanidade.'},
{s:'his',t:'A invenção da escrita',q:'O desenvolvimento da escrita é o evento que separa:',o:['a História da Pré-História','a Idade Média da Idade Moderna','o Neolítico do Paleolítico','a Antiguidade da Contemporaneidade'],e:'Por isso é considerado um marco.'},
{s:'his',t:'A invenção da escrita',q:'Os povos sem escrita produziam sua história:',o:['por meio da oralidade, de artefatos e de produções artísticas','apenas em livros','com fotografias','não produziam história'],e:'A história não depende só da escrita.'},
{s:'his',t:'A invenção da escrita',q:'A "placa de reclamação" de Ea-Nasir, de cerca de 1750 a.C., é:',o:['a reclamação escrita mais antiga já descoberta','o primeiro código de leis','um mapa do Crescente Fértil','uma receita culinária'],e:'Tábua de argila ligada à antiga Ur, hoje no Museu Britânico.'},
{s:'his',t:'A invenção da escrita',q:'A escrita chinesa:',o:['teve origem há mais de 3 000 anos e usa caracteres para representar palavras e conceitos','é igual à cuneiforme','foi criada no Egito','usa o alfabeto latino'],e:'A escrita variou de região para região.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'Os povos mesopotâmicos eram:',o:['politeístas, acreditavam em vários deuses','monoteístas','ateístas','sem religião definida'],e:'Os deuses poderiam interferir na vida cotidiana.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'Para decifrar a vontade divina, os sacerdotes mesopotâmicos usavam:',o:['a leitura das entranhas de animais e a observação de sinais celestes','livros sagrados impressos','sonhos apenas do rei','cálculos matemáticos'],e:'Isso levou ao desenvolvimento da Astronomia.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'As oferendas eram feitas para:',o:['conseguir se livrar de ameaças, como fortes vendavais e doenças','pagar impostos','alimentar o exército','decorar as casas'],e:'A população acreditava ser necessário realizar rituais diários.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'Os mesopotâmicos criaram um calendário baseado em:',o:['uma semana de sete dias, dia em doze horas duplas e ano nos ciclos da Lua','um ano de 300 dias','uma semana de dez dias','meses de 40 dias'],e:'Eles calculavam eclipses e observavam os planetas.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'Os astrônomos mesopotâmicos identificaram cinco planetas:',o:['Saturno, Júpiter, Vênus, Marte e Mercúrio','Terra, Marte, Urano, Netuno e Plutão','Vênus, Terra, Lua, Sol e Marte','Júpiter, Netuno, Urano, Saturno e Plutão'],e:'Cada planeta era associado a um dia da semana; Sol e Lua representavam os outros dois.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'Ishtar (Inanna) era a deusa:',o:['do amor, da fertilidade e da guerra','do céu e pai dos deuses','da água e da sabedoria','da terra apenas'],e:'Representada como poderosa, mas volátil.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'Enqui (Ea ou Enki) era o deus:',o:['da água, da inteligência e da magia','do fogo','da guerra','do vento'],e:'Teve papel fundamental na criação da humanidade, segundo a mitologia.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'Anu era o deus:',o:['do céu, considerado o pai dos deuses','dos mortos','da colheita','do mar'],e:'Um dos deuses supremos do panteão mesopotâmico.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'Ninhursag (Ninmah ou Ki) era a deusa:',o:['da terra, associada à fertilidade e à criação','da guerra','do submundo','da escrita'],e:'Representada como uma mãe que dá à luz a humanidade.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'O zigurate era:',o:['o templo da cidade-estado, também usado como depósito de cereais e local de observação dos astros','o palácio do rei','a muralha da cidade','um tipo de barco'],e:'O Zigurate de Ur foi concluído em 2096 a.C. e tinha sete pavimentos.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'Entre as esculturas mesopotâmicas mais famosas estão:',o:['os touros alados de Nínive, que decoravam palácios reais','as esfinges de Gizé','as estátuas gregas de mármore','os totens indígenas'],e:'Representavam seres míticos e divindades aladas.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'A "arte cuneiforme" mesopotâmica se caracteriza por:',o:['inscrições em tabuletas de argila, estelas e relevos que acompanhavam as imagens','pinturas a óleo','esculturas de gelo','mosaicos de vidro'],e:'Forneciam informações sobre o conteúdo e o contexto histórico da obra.'},
{s:'his',t:'Religião e cultura mesopotâmica',q:'A Epopeia de Gilgamesh:',o:['é uma narrativa mitológica mesopotâmica que contém um relato de dilúvio semelhante ao da Arca de Noé','é um código de leis','é um mapa antigo','foi escrita no Egito'],e:'Foi encontrada em escavações do século XIX, em escrita cuneiforme.'},
{s:'his',t:'Acádios e babilônios',q:'Os acádios viviam originalmente:',o:['próximos ao deserto da Síria','no vale do Nilo','na Grécia','na Índia'],e:'Invadiram as cidades-estado e os reinos mesopotâmicos.'},
{s:'his',t:'Acádios e babilônios',q:'Sargão, o Grande, foi o líder que:',o:['unificou as regiões Central e Sul da Mesopotâmia, criando o Império Acádio','construiu as pirâmides','escreveu a Epopeia de Gilgamesh','fundou a cidade de Ur'],e:'Um dos primeiros impérios da história.'},
{s:'his',t:'Acádios e babilônios',q:'Sargão, o Grande, em relação à cultura suméria:',o:['não impôs a cultura de seu povo, permitindo que os sumérios continuassem com suas tradições','destruiu toda a cultura suméria','proibiu a escrita cuneiforme','expulsou todos os sumérios'],e:'Isso gerou uma mistura de culturas: escrita cuneiforme com a língua acádia.'},
{s:'his',t:'Acádios e babilônios',q:'O povo amorita, originário da Arábia, fundou a cidade da Babilônia entre:',o:['2000 e 1900 a.C.','500 e 400 a.C.','1000 e 900 d.C.','3000 e 2900 d.C.'],e:'Dominou os sumérios e os acádios.'},
{s:'his',t:'Acádios e babilônios',q:'Por volta de 1792 a.C., Hamurabi:',o:['unificou o sul da Mesopotâmia e a Assíria, originando o Primeiro Império Babilônico','criou a escrita cuneiforme','fundou o Egito','derrotou os persas'],e:'A Babilônia se tornou a capital.'},
{s:'his',t:'Acádios e babilônios',q:'O Código de Hamurabi era:',o:['uma legislação que deveria ser seguida por todos no império','um livro de orações','um manual de agricultura','um mapa do império'],e:'Levou o nome de seu criador.'},
{s:'his',t:'Acádios e babilônios',q:'O Código de Hamurabi tratava de assuntos como:',o:['família, roubo, divórcio, escravidão, construções civis e trabalho','apenas religião','somente guerra','apenas comércio exterior'],e:'Regulava a vida e as propriedades da população.'},
{s:'his',t:'Acádios e babilônios',q:'Sobre a criação do Código de Hamurabi, é correto dizer que:',o:['Hamurabi não inventou as leis, mas as unificou na escrita cuneiforme acadiana','ele criou todas as leis do zero','as leis vieram do Egito','elas nunca foram escritas'],e:'Muitas já eram praticadas em outras sociedades.'},
{s:'his',t:'Acádios e babilônios',q:'O Princípio de Talião pode ser resumido como:',o:['"olho por olho, dente por dente"','"todos são iguais perante a lei"','"o rei está acima da lei"','"a lei perdoa quem se arrepende"'],e:'A pena correspondia ao sofrimento causado ao outro.'},
{s:'his',t:'Acádios e babilônios',q:'Na aplicação do Código de Hamurabi:',o:['havia diferença de tratamento e punição conforme a classe social','todos recebiam a mesma pena','só os nobres eram punidos','não havia punições'],e:'O "olho por olho" valia apenas entre pessoas do mesmo grupo social.'},
{s:'his',t:'Acádios e babilônios',q:'A Estela de Hamurabi é:',o:['o monolito no qual foi inscrito o Código de Hamurabi','uma estátua de Sargão','um templo babilônico','uma tumba real'],e:'Antes dele, as leis eram apenas faladas, e cada governante podia mudá-las.'},
{s:'his',t:'Acádios e babilônios',q:'O Portão de Ishtar foi construído em homenagem:',o:['à deusa babilônica Istar','ao rei Hamurabi','ao deus Anu','ao Império Persa'],e:'Já foi considerado uma das maravilhas do mundo antigo.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'Após a morte de Hamurabi, o Primeiro Império Babilônico:',o:['começou a declinar gradualmente, enfrentando ataques de outros povos','se expandiu ainda mais','virou uma república','desapareceu de uma só vez'],e:'A Assíria lutava contra seus vizinhos em busca de controle político.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'Por volta de 1000 a.C., os assírios conquistaram terras a partir da cidade de:',o:['Assur, na Alta Mesopotâmia','Babilônia','Ur','Meroé'],e:'Estabeleceram assim o Império Assírio.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'O exército assírio era poderoso porque contava com:',o:['arqueiros e lanceiros bem treinados e armas de ferro','elefantes de guerra','navios a vapor','cavalaria pesada com armaduras de ouro'],e:'As armas de ferro eram melhores que as de bronze.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'Em 600 a.C., o Império Assírio foi dominado pelos:',o:['caldeus','egípcios','gregos','romanos'],e:'Povo que habitava o sul da Mesopotâmia.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'O rei caldeu mais importante foi:',o:['Nabucodonosor','Sargão','Hamurabi','Ciro II'],e:'Instalou seu governo na Babilônia, iniciando o Segundo Império Babilônico.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'O período de domínio caldeu ficou conhecido como:',o:['Segundo Império Babilônico ou Império Neobabilônico','Império Acádio','Império Persa','Império Assírio'],e:'Nabucodonosor tentou reviver a cultura da época de Hamurabi.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'Os Jardins Suspensos da Babilônia:',o:['foram considerados uma das Sete Maravilhas do Mundo Antigo, mas não há evidências concretas de sua existência','foram totalmente preservados até hoje','ficavam no Egito','eram um templo religioso'],e:'Atribuídos ao reinado de Nabucodonosor.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'Medos e persas eram:',o:['grupos nômades vindos da Ásia que se estabeleceram no leste da Mesopotâmia por volta de 2000 a.C.','povos africanos','habitantes originais de Ur','colonos gregos'],e:'Os medos ao oeste/noroeste e os persas ao sudoeste.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'Em 612 a.C., os medos:',o:['expandiram seu império e destruíram a capital do Reino Assírio','foram derrotados pelos egípcios','fundaram a Babilônia','criaram a escrita cuneiforme'],e:'Antes já haviam conquistado os persas.'},
{s:'his',t:'Assírios, caldeus e declínio',q:'Em 550 a.C., quem se revoltou contra os medos e formou o Império Persa?',o:['Ciro II, conhecido como "Ciro, o Grande"','Nabucodonosor','Hamurabi','Sargão, o Grande'],e:'Com isso, as cidades mesopotâmicas perderam sua independência.'},
// --- Cap. 4: Antiguidade Africana
{s:'his',t:'Egito: o Rio Nilo',q:'Os primeiros grupos humanos se estabeleceram próximos ao Rio Nilo por volta de:',o:['5500 a.C.','1500 d.C.','500 a.C.','12000 d.C.'],e:'Na região nordeste da África.'},
{s:'his',t:'Egito: o Rio Nilo',q:'Dizer que o Nilo é PERENE significa que ele:',o:['não seca','transborda todo mês','é salgado','muda de lugar'],e:'Por isso a escolha da região foi estratégica.'},
{s:'his',t:'Egito: o Rio Nilo',q:'Sem o Rio Nilo, o Egito:',o:['seria um grande deserto','continuaria igual','viraria uma floresta','seria coberto pelo mar'],e:'Foi a proximidade com a água que possibilitou a civilização.'},
{s:'his',t:'Egito: o Rio Nilo',q:'As inundações anuais do Nilo eram importantes porque:',o:['depositavam sedimentos férteis nas margens, tornando o solo propício à agricultura','levavam ouro','esfriavam o deserto','afastavam os inimigos'],e:'Base da agricultura egípcia.'},
{s:'his',t:'Egito: o Rio Nilo',q:'Além da agricultura, o Nilo servia como:',o:['rota de transporte, comércio e fonte de alimentos, como peixes','apenas fonte de água para banho','campo de batalha','fronteira intransponível'],e:'As embarcações facilitavam a comunicação entre as regiões.'},
{s:'his',t:'Egito: o Rio Nilo',q:'As cheias do Nilo também podiam ser ruins porque:',o:['destruíam casas próximas ao rio, causavam estragos nas plantações e traziam animais perigosos, como crocodilos','deixavam o solo estéril para sempre','congelavam o rio','secavam os poços'],e:'Por isso surgiu a necessidade de controlar a natureza.'},
{s:'his',t:'Egito: o Rio Nilo',q:'Os DIQUES construídos pelos egípcios eram:',o:['barreiras erguidas ao longo do rio para conter a passagem da água','canais para irrigar as plantações','templos religiosos','túmulos de faraós'],e:'Já os canais de irrigação distribuíam a água pelas cidades.'},
{s:'his',t:'Egito: o Rio Nilo',q:'Os reservatórios egípcios serviam para:',o:['armazenar água em excesso e amenizar os efeitos da seca nos períodos de estiagem','guardar grãos','abrigar soldados','criar peixes'],e:'Forma de controlar os fenômenos da natureza.'},
{s:'his',t:'Egito: faraós',q:'Por volta de 3100 a.C., quem unificou o Alto e o Baixo Egito?',o:['Menés, também conhecido como Narmer','Tutancâmon','Cleópatra','Ramsés II'],e:'Ele deu origem à Primeira Dinastia e se tornou o primeiro faraó.'},
{s:'his',t:'Egito: faraós',q:'O Baixo Egito ficava ao ___ e o Alto Egito ao ___.',o:['norte / sul','sul / norte','leste / oeste','oeste / leste'],e:'O Baixo Egito é a região do delta do Nilo.'},
{s:'his',t:'Egito: faraós',q:'O termo "faraó" significa:',o:['"a grande casa", referindo-se à sede da administração política do Egito','"filho do rio"','"senhor da guerra"','"sacerdote do Sol"'],e:'Vem do nome do palácio real.'},
{s:'his',t:'Egito: faraós',q:'Teocracia é o sistema de governo em que:',o:['as autoridades políticas são líderes religiosos','o povo elege seus governantes','os militares governam','não existe governo'],e:'Os faraós tinham poder político e religioso ao mesmo tempo.'},
{s:'his',t:'Egito: faraós',q:'Os faraós eram vistos como deuses porque, segundo a crença:',o:['descendiam do deus Rá e eram considerados "Hórus", filhos do deus Sol em forma humana','eram escolhidos pelo povo','venciam sempre as guerras','viviam mais de cem anos'],e:'Assim, seu poder era de origem divina e não podia ser questionado.'},
{s:'his',t:'Egito: faraós',q:'Hatshepsut foi:',o:['a primeira faraó mulher, que assumiu o trono após a morte de seu marido, Tutmés II','a última rainha do Egito','uma sacerdotisa de Amon','uma rainha núbia'],e:'Para legitimar seu reinado, criou um mito de nascimento divino como filha do deus Amon.'},
{s:'his',t:'Egito: faraós',q:'A história de Hatshepsut foi parcialmente apagada porque:',o:['seus sucessores tentaram ignorar o reinado dela, removendo inscrições e monumentos','ela nunca existiu','os documentos se perderam no Nilo','ela pediu para ser esquecida'],e:'Pesquisas modernas ajudaram a restaurar sua história.'},
{s:'his',t:'Egito: faraós',q:'Cleópatra foi:',o:['a última rainha do Egito, da dinastia dos Ptolomeus','a primeira faraó mulher','a esposa de Menés','uma deusa egípcia'],e:'Após uma luta pelo poder, assumiu o trono e governou sozinha.'},
{s:'his',t:'Egito: faraós',q:'A barba postiça usada pelo faraó em público:',o:['era um símbolo que enfatizava sua divindade e autoridade real','servia para proteger do sol','indicava idade avançada','era usada só nas guerras'],e:'Ele também usava joias e trajes luxuosos.'},
{s:'his',t:'Egito: economia',q:'O trigo era cultivado no Egito Antigo principalmente para:',o:['fazer pães','produzir papel','fabricar roupas','alimentar cavalos'],e:'Base da alimentação egípcia.'},
{s:'his',t:'Egito: economia',q:'O papiro era importante porque:',o:['alimentava a população mais pobre e servia de material-base para a produção de pergaminhos de escrita','era usado só como enfeite','servia para construir casas','era moeda de troca'],e:'Duplo uso: alimento e suporte para escrita.'},
{s:'his',t:'Egito: economia',q:'O cultivo de linho era fundamental para:',o:['a produção de roupas','a fabricação de tijolos','a alimentação dos faraós','a construção de barcos'],e:'Os egípcios vestiam roupas de linho.'},
{s:'his',t:'Egito: economia',q:'No Egito Antigo, os bois eram criados principalmente para:',o:['pisotear os campos, semear as sementes e complementar a alimentação','puxar carruagens de guerra','serem sacrificados nos templos apenas','transporte de pessoas'],e:'A carne de boi era mais cara devido à necessidade de pastagens.'},
{s:'his',t:'Egito: economia',q:'O Egito precisava importar produtos como:',o:['madeira, essencial para a construção naval, e minerais como pedras preciosas','trigo e cevada','água potável','papiro'],e:'O transporte era feito principalmente pelo Rio Nilo.'},
{s:'his',t:'Egito: economia',q:'Sobre a moeda no Egito Antigo:',o:['ela só foi criada no período de decadência dessa civilização; antes o comércio menor era feito por troca de excedentes','existiu desde o início','era feita de papiro','nunca foi criada'],e:'As pessoas trocavam o que sobrava por itens de que precisavam.'},
{s:'his',t:'Egito: sociedade',q:'Uma sociedade ESTRATIFICADA é aquela que:',o:['está dividida em diferentes estratos ou camadas, gerando desigualdade','é totalmente igualitária','não tem governo','vive sem regras'],e:'A base sustentava economicamente a minoria privilegiada.'},
{s:'his',t:'Egito: sociedade',q:'No topo da pirâmide social egípcia estavam:',o:['o faraó e sua família','os escribas','os comerciantes','os felás'],e:'Considerados de origem divina.'},
{s:'his',t:'Egito: sociedade',q:'O vizir, no Egito Antigo, fazia parte:',o:['da nobreza hereditária, como funcionário do governo','dos escravos','dos camponeses','dos soldados rasos'],e:'Os sacerdotes também eram responsáveis por rituais e oferendas.'},
{s:'his',t:'Egito: sociedade',q:'Os escribas eram responsáveis por:',o:['escrever leis e documentar eventos significativos usando hieróglifos em pergaminhos de papiro','comandar o exército','construir as pirâmides','cultivar a terra'],e:'Poucos dominavam a escrita: era um cargo de prestígio.'},
{s:'his',t:'Egito: sociedade',q:'Os felás eram:',o:['os camponeses, principais responsáveis por cultivar a terra e produzir alimentos','os sacerdotes','os comerciantes','os nobres'],e:'Contribuíam significativamente para a subsistência do Egito.'},
{s:'his',t:'Egito: sociedade',q:'Os escravos no Egito Antigo eram, frequentemente:',o:['prisioneiros de guerra obrigados a trabalhar nas minas e pedreiras controladas pelo governo','pessoas que escolhiam essa condição','estrangeiros ricos','sacerdotes punidos'],e:'Estavam na base da pirâmide social.'},
{s:'his',t:'Egito: sociedade',q:'Sobre as roupas no Egito Antigo:',o:['os felás trabalhavam apenas com uma tanga, enquanto funcionários públicos e a família real usavam linho drapeado','todos vestiam-se igual','ninguém usava roupas','só os escravos usavam linho'],e:'A roupa indicava a ocupação e a posição social.'},
{s:'his',t:'Egito: sociedade',q:'A SERVIDÃO no Egito Antigo era:',o:['uma forma de trabalho intermediária entre a liberdade e a escravidão','o mesmo que escravidão','trabalho totalmente livre e bem pago','proibida por lei'],e:'Os servos eram vinculados à terra e não eram livres para escolher onde trabalhar.'},
{s:'his',t:'Egito: sociedade',q:'Comparada à Mesopotâmia, a escravidão no Egito era:',o:['mais limitada, dado que apenas o faraó e a elite possuíam escravos','muito mais ampla','inexistente','igual em tudo'],e:'A maioria dos escravizados era prisioneira de guerra.'},
{s:'his',t:'Egito: escrita e monumentos',q:'Os hieróglifos eram:',o:['um sistema de escrita pictográfica composto por símbolos que representavam palavras, sons, objetos, conceitos e ideias','um alfabeto de 26 letras','números apenas','desenhos sem significado'],e:'Usados em monumentos, templos, túmulos e papiros.'},
{s:'his',t:'Egito: escrita e monumentos',q:'A Pedra de Roseta foi importante porque:',o:['tinha uma inscrição em três línguas que permitiu decifrar os hieróglifos','continha o mapa do Egito','era feita de ouro','listava todos os faraós'],e:'Encontrada no século XIX.'},
{s:'his',t:'Egito: escrita e monumentos',q:'Quem decifrou a escrita hieroglífica, em 1822?',o:['François Champollion','Thomas Young','Heródoto','Napoleão Bonaparte'],e:'A língua egípcia foi decifrada a partir do copta, idioma ainda usado na Igreja cristã egípcia.'},
{s:'his',t:'Egito: escrita e monumentos',q:'As pirâmides do Egito eram, na maioria das vezes:',o:['túmulos das altas classes sociais, como os faraós','templos de comércio','fortalezas militares','depósitos de grãos'],e:'Os templos eram os locais de adoração e oferendas.'},
{s:'his',t:'Egito: escrita e monumentos',q:'As Pirâmides de Gizé (ca. 2550 a.C.) incluem:',o:['a Pirâmide de Quéops, a de Quéfren e a de Miquerinos','apenas uma pirâmide','a Esfinge e o Zigurate','as pirâmides de Meroé'],e:'São consideradas uma das Sete Maravilhas do Mundo Antigo.'},
{s:'his',t:'Egito: escrita e monumentos',q:'A Esfinge de Gizé é uma escultura com:',o:['corpo de leão e cabeça humana','corpo humano e cabeça de falcão','corpo de touro e asas','cabeça de chacal'],e:'Datada de cerca de 2500 a.C., associada à proteção de complexos funerários.'},
{s:'his',t:'Egito: escrita e monumentos',q:'Alguns canais internos das pirâmides:',o:['se alinhavam com estrelas como a Ursa Menor e Sírius, o que sugere conotações religiosas ou astronômicas','serviam apenas de esgoto','eram usados como estradas','não existem'],e:'Outros acreditam que serviam para ventilação.'},
{s:'his',t:'Egito: escrita e monumentos',q:'As inscrições nas tumbas dos faraós tinham a intenção de:',o:['garantir proteção, orientação e continuidade do faraó no além-vida','contar piadas','registrar dívidas','ensinar agricultura'],e:'Também serviam como documentação histórica e expressão de poder.'},
{s:'his',t:'Egito: religião',q:'A religião egípcia era politeísta, e os deuses podiam ter formas:',o:['humanas (antropomorfismo), de animais (zoomorfismo) ou mistas (antropozoomorfismo)','apenas humanas','apenas de animais','sempre invisíveis'],e:'Cada deus correspondia a uma força da natureza e representava um grupo social ou cidade.'},
{s:'his',t:'Egito: religião',q:'Rá era o deus:',o:['do Sol e do céu, representado com cabeça de falcão ou disco solar','dos mortos','da escrita','da guerra'],e:'Acreditava-se que percorria o céu de dia e o mundo subterrâneo à noite.'},
{s:'his',t:'Egito: religião',q:'Nut era:',o:['a personificação do céu, representada como uma mulher arqueada sobre o mundo','a deusa da guerra','o deus do Nilo','a deusa dos gatos'],e:'Acreditava-se que engolia o Sol à noite e o dava à luz durante o dia.'},
{s:'his',t:'Egito: religião',q:'Bastet era a deusa:',o:['da casa, da família e da proteção, representada em forma de gato','do Sol','da guerra','da escrita'],e:'Acreditava-se que afastava pestes e doenças.'},
{s:'his',t:'Egito: religião',q:'Amon, fundido com o deus solar Rá, tornou-se:',o:['Amon-Rá, a divindade suprema do panteão egípcio','Osíris','Anúbis','Thot'],e:'Representado com uma coroa dupla, associada ao Alto e ao Baixo Egito.'},
{s:'his',t:'Egito: religião',q:'Osíris era o deus:',o:['dos mortos, da ressurreição e do renascimento, representado com a pele verde','do Sol','da sabedoria','da casa'],e:'A pele verde simbolizava o renascimento anual das colheitas.'},
{s:'his',t:'Egito: religião',q:'Ísis era:',o:['esposa de Osíris e deusa da maternidade, da magia e da proteção','a deusa do Sol','o deus da mumificação','a deusa da guerra'],e:'Figura antropomórfica.'},
{s:'his',t:'Egito: religião',q:'Thot, representado com cabeça de íbis, era o deus:',o:['da sabedoria, da escrita e da medição do tempo','da guerra','do amor','do vento'],e:'É ele quem anota o resultado da pesagem do coração.'},
{s:'his',t:'Egito: religião',q:'Anúbis, com cabeça de chacal, era o deus:',o:['da mumificação e dos mortos','da colheita','do céu','do comércio'],e:'Supervisionava o embalsamamento e guiava as almas no além.'},
{s:'his',t:'Egito: religião',q:'Maat era a deusa:',o:['da ordem, da justiça e da verdade, representada com uma pena de avestruz','da guerra','da fertilidade','do Nilo'],e:'Sua pena é usada na balança do julgamento dos mortos.'},
{s:'his',t:'Egito: mumificação',q:'Os egípcios acreditavam que, após a morte:',o:['a alma (ka) sobreviveria e precisaria de cuidados para garantir uma passagem segura ao além','tudo acabava','a alma virava uma estrela','o corpo desaparecia'],e:'Isso levou à construção de complexos funerários.'},
{s:'his',t:'Egito: mumificação',q:'A primeira etapa da mumificação era:',o:['a limpeza, em um local chamado Ibu, com vinho de palma e água do Rio Nilo','o enfaixamento','a remoção dos órgãos','a desidratação'],e:'Depois vinha a remoção dos órgãos.'},
{s:'his',t:'Egito: mumificação',q:'Na mumificação, qual órgão NÃO era removido do corpo?',o:['O coração','O estômago','O pulmão','O fígado'],e:'O coração era considerado o centro da inteligência e das emoções.'},
{s:'his',t:'Egito: mumificação',q:'Os órgãos mais importantes retirados na mumificação eram guardados em:',o:['vasos','caixas de madeira','sacos de linho','poços de água'],e:'Estômago, intestino, pulmão e fígado.'},
{s:'his',t:'Egito: mumificação',q:'Na etapa de desidratação, o corpo era coberto com:',o:['natrão, um composto natural formado principalmente por carbonato de sódio','sal marinho','areia do deserto','cinzas'],e:'O natrão absorvia a umidade e preservava os tecidos.'},
{s:'his',t:'Egito: mumificação',q:'No enfaixamento, o corpo era envolvido com tiras de:',o:['linho, com amuletos protetores inseridos entre as camadas','papiro','couro','algodão'],e:'Os amuletos protegiam na vida após a morte.'},
{s:'his',t:'Egito: mumificação',q:'O amuleto Ankh representava:',o:['a crença de que auxiliava na superação dos obstáculos na próxima vida','a proteção do coração apenas','a riqueza do faraó','o poder militar'],e:'É o símbolo da vida.'},
{s:'his',t:'Egito: mumificação',q:'O escaravelho era colocado com a intenção de:',o:['impedir que o coração se separasse do corpo do falecido','proteger os olhos','trazer riqueza','afastar insetos'],e:'Já o Olho de Wadjet ficava na testa, como símbolo de proteção.'},
{s:'his',t:'Egito: mumificação',q:'No Tribunal de Osíris, quantos deuses aguardavam a alma para julgá-la?',o:['42','12','7','100'],e:'A alma navegava em um rio até chegar ao local do julgamento.'},
{s:'his',t:'Egito: mumificação',q:'No julgamento dos mortos, Anúbis pesava o coração do morto contra:',o:['uma pena, que simbolizava a deusa Maat (verdade e justiça)','uma pedra de ouro','um vaso de barro','uma estátua'],e:'Se o coração fosse mais leve que a pena, o morto teria direito à vida eterna.'},
{s:'his',t:'Egito: mumificação',q:'Quem devorava o coração de quem não praticou boas ações em vida?',o:['O monstro do Nilo, Amit','O deus Thot','A deusa Ísis','O faraó'],e:'Quem preside o julgamento é o deus Osíris.'},
{s:'his',t:'Egito: mumificação',q:'Tutancâmon ficou conhecido como:',o:['o "Rei Menino", cuja tumba foi descoberta quase intacta no século XX','o unificador do Egito','o criador dos hieróglifos','o último faraó'],e:'A tumba continha uma riqueza de artefatos e tesouros.'},
{s:'his',t:'A Antiguidade Núbia',q:'A Núbia estava localizada:',o:['no nordeste da África, ao longo do vale do Rio Nilo, ao sul do Egito e norte do Sudão','no oeste da África','na Península Arábica','no sul da Europa'],e:'Região historicamente rica.'},
{s:'his',t:'A Antiguidade Núbia',q:'Os registros arqueológicos indicam que a Antiguidade Núbia remonta a pelo menos:',o:['3500 a.C.','1500 d.C.','500 a.C.','100 a.C.'],e:'Época dos primeiros assentamentos agrícolas às margens do Nilo.'},
{s:'his',t:'A Antiguidade Núbia',q:'O nome do Reino Ta-Seti significa:',o:['"Terra dos Arqueiros"','"Terra do Ouro"','"Reino do Sol"','"Vale dos Reis"'],e:'Seus habitantes eram conhecidos pela habilidade como arqueiros.'},
{s:'his',t:'A Antiguidade Núbia',q:'Durante o Reino de Cuxe (Kush), entre 747 a.C. e 656 a.C.:',o:['os núbios conquistaram o Egito e governaram como a Dinastia 25','o Egito conquistou a Núbia','a Núbia foi destruída','os romanos chegaram à região'],e:'A capital de Cuxe era Napata, depois transferida para Meroé.'},
{s:'his',t:'A Antiguidade Núbia',q:'No Período Meroítico (300 a.C. a 350 d.C.):',o:['a cultura meroítica floresceu e os meroítas desenvolveram seu próprio sistema de escrita','a Núbia deixou de existir','os núbios abandonaram o Nilo','o Egito dominou tudo'],e:'Meroé era a capital e mantinha relações comerciais com o Mediterrâneo.'},
{s:'his',t:'A Antiguidade Núbia',q:'A partir do século IV, a Núbia:',o:['passou por influência romana e cristã, com povos convertidos ao cristianismo','virou parte do Egito','foi abandonada','tornou-se muçulmana'],e:'Depois ficou sob influência do Império Bizantino.'},
{s:'his',t:'A Antiguidade Núbia',q:'A partir do século VII, a Núbia começou a ser:',o:['islamizada, o que marcou o declínio das culturas cristãs e meroíticas','romanizada','egípcia novamente','despovoada'],e:'Fim de um longo período histórico.'},
{s:'his',t:'A Antiguidade Núbia',q:'Por volta de 730 a.C., quem lançou uma campanha militar no Egito e iniciou a XXV Dinastia?',o:['Piye, rei da Núbia','Ramsés II','Nabucodonosor','Ezana'],e:'Tornou-se o primeiro faraó núbio na região.'},
{s:'his',t:'A Antiguidade Núbia',q:'Por que os egípcios buscavam expandir seu território em direção à Núbia?',o:['Pela localização estratégica e pelos recursos naturais, como minerais e pedras preciosas','Por causa do clima frio','Para fugir das cheias do Nilo','Para escapar dos assírios'],e:'A Núbia também tentava expandir suas influências e conquistar o Egito.'},
{s:'his',t:'A Antiguidade Núbia',q:'A economia da Núbia se apoiava em três frentes:',o:['mineração, agricultura e comércio','pesca, caça e coleta','indústria, serviços e turismo','navegação, guerra e tributos'],e:'A região era rica em ouro, cobre, pedras preciosas e minerais de ferro.'},
{s:'his',t:'A Antiguidade Núbia',q:'A cidade de Meroé era importante porque:',o:['era um centro comercial movimentado, ponto de encontro entre o Egito e as regiões ao sul da África','era a capital do Egito','ficava na Europa','era um porto no Mediterrâneo'],e:'Produtos núbios, como tecidos e cerâmica, eram fabricados internamente.'},
{s:'his',t:'A Antiguidade Núbia',q:'No topo da hierarquia da sociedade núbia estavam:',o:['a realeza e a elite: os reis e a aristocracia','os agricultores','os artesãos','os escravos'],e:'A realeza tinha autoridade suprema sobre a terra e o povo.'},
{s:'his',t:'A Antiguidade Núbia',q:'A maioria da população núbia era composta por:',o:['agricultores e trabalhadores braçais','sacerdotes','comerciantes ricos','soldados'],e:'Eram responsáveis pela produção de alimentos e pela construção de monumentos.'},
{s:'his',t:'A Antiguidade Núbia',q:'ORALIDADE é:',o:['a tradição de transmitir conhecimento, histórias e informações por meio da fala','a escrita em pedra','o desenho em cavernas','o uso de sinais de fumaça'],e:'Foi o principal meio de preservação do conhecimento na Núbia.'},
{s:'his',t:'A Antiguidade Núbia',q:'Na tradição oral núbia, quem tinha papel crucial na transmissão de histórias?',o:['Os mais velhos','As crianças','Os estrangeiros','Os escravos'],e:'Transmitiam mitos, lendas e conhecimentos ancestrais às gerações mais jovens.'},
{s:'his',t:'A Antiguidade Núbia',q:'A religião dos povos núbios era:',o:['politeísta, com deuses compartilhados com o Egito, como Osíris e Ísis, e divindades próprias','monoteísta','cristã desde o início','sem deuses'],e:'As divindades locais refletiam sua identidade única.'},
{s:'his',t:'A Antiguidade Núbia',q:'Apedemak era o deus núbio:',o:['da guerra, da fertilidade e da proteção do rei, representado com cabeça de tigre e corpo humano','do Sol','da escrita','da música'],e:'Figura antropozoomórfica.'},
{s:'his',t:'A Antiguidade Núbia',q:'Sebiumeker era o deus núbio:',o:['da fertilidade e da colheita, com papel fundamental na agricultura','da guerra','dos mortos','do mar'],e:'Figura antropomórfica.'},
{s:'his',t:'A Antiguidade Núbia',q:'Bes era o deus núbio:',o:['da música, da dança e da alegria','da guerra','da morte','da chuva'],e:'Retratado com aparência caricatural, invocado para trazer alegria e proteção.'},
{s:'his',t:'O Reino de Axum',q:'O Reino de Axum se formou onde hoje estão os países:',o:['Etiópia e Eritreia','Egito e Sudão','Marrocos e Argélia','África do Sul e Namíbia'],e:'Na região conhecida como Planalto do Tigré.'},
{s:'his',t:'O Reino de Axum',q:'Quem unificou as comunidades isoladas de Axum, no século I?',o:['O rei Zoscales, também conhecido como Za Hecale','O rei Ezana','O rei Kaleb','O rei Piye'],e:'Os primeiros habitantes eram povos do século V a.C.'},
{s:'his',t:'O Reino de Axum',q:'O auge do poder do Reino de Axum ocorreu entre os séculos:',o:['IV e VII','I e II','X e XII','XV e XVI'],e:'Axum rivalizava comercial e politicamente com o Império Romano.'},
{s:'his',t:'O Reino de Axum',q:'O rei Ezana (ca. 325 a 360) ficou conhecido por:',o:['pacificar tribos e introduzir o cristianismo no reino axumita','construir pirâmides','criar a escrita ge\'ez','conquistar o Egito'],e:'O cristianismo virou religião de prestígio após ser oficial no Império Romano.'},
{s:'his',t:'O Reino de Axum',q:'O rei Kaleb, também conhecido como Elesbão (ca. 570 a 590):',o:['foi um guerreiro que expandiu os territórios de Axum, conquistando partes do sul da Arábia','introduziu o Islã','fundou Meroé','destruiu Axum'],e:'Foi transformado em santidade pela Igreja Ortodoxa Etíope.'},
{s:'his',t:'O Reino de Axum',q:'O rei Degna Djan (ca. 600 a 620) enfrentou:',o:['conflitos internos e a propagação da religião Islã na região','a invasão romana','a chegada dos portugueses','uma grande seca'],e:'Momento de desafios para o reino.'},
{s:'his',t:'O Reino de Axum',q:'A cidade de Adulis, em Axum, era importante porque:',o:['tinha um porto fundamental no comércio marítimo entre a região e outras partes do mundo','era a capital religiosa','tinha as maiores minas de ouro','era uma fortaleza militar'],e:'Ligava Axum a Grécia, Roma, Egito, Península Arábica, Pérsia, Síria e Índia.'},
{s:'his',t:'O Reino de Axum',q:'A localização de Axum, próxima ao Mar Vermelho, permitiu:',o:['controlar rotas comerciais entre o interior da África e as civilizações do Mediterrâneo','isolamento total do reino','o domínio do Oceano Atlântico','a conquista da Europa'],e:'Posição estratégica.'},
{s:'his',t:'O Reino de Axum',q:'Axum foi uma das primeiras civilizações africanas a:',o:['emitir moedas, o que facilitou o comércio monetizado','construir pirâmides','usar hieróglifos','domesticar o cavalo'],e:'As moedas traziam imagens ou nomes dos reis gravados.'},
{s:'his',t:'O Reino de Axum',q:'Antes do cristianismo, os axumitas eram:',o:['politeístas e cultuavam deuses ligados a elementos naturais, como o Sol, a Lua e as estrelas','monoteístas','ateus','muçulmanos'],e:'Acreditavam que seus ancestrais poderiam se tornar espíritos.'},
{s:'his',t:'O Reino de Axum',q:'Marém era, para os axumitas:',o:['a divindade patrona de Axum, deus do céu, das tribos, da guerra e da família','a deusa do Sol','o deus da colheita','a deusa da fertilidade'],e:'Seu símbolo era uma lua crescente envolta por um disco solar.'},
{s:'his',t:'O Reino de Axum',q:'Shams era, na religião axumita:',o:['a deusa do Sol, representando a divindade solar','o deus da guerra','a deusa da terra','o deus da chuva'],e:'Astart era a deusa da fertilidade e Warq, deus da guerra.'},
{s:'his',t:'O Reino de Axum',q:'As ESTELAS de Axum eram:',o:['grandes monumentos que serviam como sepulturas de reis e líderes importantes','moedas de ouro','templos subterrâneos','muralhas de defesa'],e:'Algumas também comemoravam eventos marcantes.'},
{s:'his',t:'O Reino de Axum',q:'Além do cristianismo e do politeísmo, parte considerável dos axumitas praticava:',o:['o judaísmo','o budismo','o hinduísmo','o xintoísmo'],e:'Religião ainda seguida por menos de 1% da população da atual Etiópia.'},
{s:'his',t:'O Reino de Axum',q:'O idioma de escrita usado pelos axumitas era o:',o:['ge\'ez','latim','grego','árabe'],e:'Usado em inscrições em pedra, documentos religiosos e textos administrativos.'},
{s:'his',t:'O Reino de Axum',q:'Na escrita ge\'ez:',o:['cada símbolo representa uma consoante seguida por uma vogal inerente (sistema silábico)','cada símbolo é uma palavra inteira','só existem vogais','os símbolos são desenhos de animais'],e:'É escrita da esquerda para a direita.'},
