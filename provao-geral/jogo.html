{s:'mat',t:'Expressões numéricas',q:'(2 + 3) × 4 é igual a:',o:['20','14','9','24'],e:'Parênteses primeiro: 5 × 4 = 20.'},
{s:'mat',t:'Expressões numéricas',q:'20 − 4 × 3 é igual a:',o:['8','48','12','16'],e:'4 × 3 = 12; 20 − 12 = 8.'},
{s:'mat',t:'Expressões numéricas',q:'5 + 2² é igual a:',o:['9','49','14','7'],e:'A potência vem antes: 2² = 4; 5 + 4 = 9.'},
{s:'mat',t:'Expressões numéricas',q:'10 ÷ 2 + 3 é igual a:',o:['8','2','5','15'],e:'Divisão primeiro: 5 + 3 = 8.'},
{s:'mat',t:'Expressões numéricas',q:'3² + 4 × 2 é igual a:',o:['17','26','13','36'],e:'9 + 8 = 17.'},
{s:'mat',t:'Expressões numéricas',q:'[ (3 + 2) × 2 ] − 4 é igual a:',o:['6','10','14','1'],e:'Parênteses: 5; colchetes: 10; depois 10 − 4 = 6.'},
{s:'mat',t:'Expressões numéricas',q:'100 − [ 20 + (5 × 3) ] é igual a:',o:['65','75','35','60'],e:'5 × 3 = 15; 20 + 15 = 35; 100 − 35 = 65.'},
{s:'mat',t:'Expressões numéricas',q:'Quando só há adições e subtrações, resolve-se:',o:['na ordem em que aparecem, da esquerda para a direita','primeiro todas as subtrações','primeiro todas as adições','da direita para a esquerda'],e:'10 − 3 + 2 = 7 + 2 = 9.'},
{s:'mat',t:'Expressões numéricas',q:'{ 12 + [ 4 × (6 − 4) ] } é igual a:',o:['20','16','24','32'],e:'6 − 4 = 2; 4 × 2 = 8; 12 + 8 = 20.'},
// --- Critérios de divisibilidade
{s:'mat',t:'Critérios de divisibilidade',q:'Um número é divisível por 2 quando:',o:['termina em 0, 2, 4, 6 ou 8','a soma dos algarismos é par','termina em 5','é maior que 100'],e:'Ou seja, quando é par.'},
{s:'mat',t:'Critérios de divisibilidade',q:'Um número é divisível por 3 quando:',o:['a soma de seus algarismos é divisível por 3','ele termina em 3','ele é ímpar','ele termina em 0'],e:'123 → 1+2+3 = 6, divisível por 3.'},
{s:'mat',t:'Critérios de divisibilidade',q:'Um número é divisível por 5 quando:',o:['termina em 0 ou 5','termina em 5 apenas','é ímpar','a soma dos algarismos é 5'],e:'25, 40, 135...'},
{s:'mat',t:'Critérios de divisibilidade',q:'Um número é divisível por 10 quando:',o:['termina em 0','termina em 1','é par','a soma dos algarismos é 10'],e:'Divisível por 2 e por 5 ao mesmo tempo.'},
{s:'mat',t:'Critérios de divisibilidade',q:'Um número é divisível por 4 quando:',o:['os dois últimos algarismos formam um número divisível por 4','ele é par','termina em 4','a soma dos algarismos é divisível por 4'],e:'4 528 → 28 é divisível por 4, então 4 528 também é.'},
{s:'mat',t:'Critérios de divisibilidade',q:'Um número é divisível por 9 quando:',o:['a soma de seus algarismos é divisível por 9','ele termina em 9','ele é ímpar','ele é divisível por 3 apenas'],e:'234 → 2+3+4 = 9, divisível por 9.'},
{s:'mat',t:'Critérios de divisibilidade',q:'Um número é divisível por 6 quando:',o:['é divisível por 2 e por 3 ao mesmo tempo','termina em 6','é divisível por 5','a soma dos algarismos é 6'],e:'132 é par e 1+3+2 = 6, então é divisível por 6.'},
{s:'mat',t:'Critérios de divisibilidade',q:'O número 4 725 é divisível por:',o:['5','2','10','4'],e:'Termina em 5. Como é ímpar, não é divisível por 2, 10 nem 4.'},
{s:'mat',t:'Critérios de divisibilidade',q:'Qual destes números é divisível por 3?',o:['417','410','431','425'],e:'4+1+7 = 12, divisível por 3.'},
{s:'mat',t:'Critérios de divisibilidade',q:'Qual destes números é divisível por 9?',o:['531','532','537','541'],e:'5+3+1 = 9.'},
{s:'mat',t:'Critérios de divisibilidade',q:'O número 1 000 é divisível por 2, 4, 5 e 10?',o:['Sim, por todos eles','Só por 2 e 5','Só por 10','Não é divisível por nenhum'],e:'É par, termina em 0 e 00 é divisível por 4.'},
{s:'mat',t:'Critérios de divisibilidade',q:'Os critérios de divisibilidade servem para:',o:['descobrir se a divisão é exata sem precisar fazer a conta','achar o resto da divisão','somar mais rápido','transformar em fração'],e:'São atalhos para saber se o resto será zero.'},
// --- Divisão exata e não exata
{s:'mat',t:'Divisão exata e não exata',q:'Uma divisão é EXATA quando:',o:['o resto é igual a zero','o quociente é zero','o divisor é maior que o dividendo','o resto é 1'],e:'20 ÷ 4 = 5, resto 0.'},
{s:'mat',t:'Divisão exata e não exata',q:'Uma divisão é NÃO EXATA quando:',o:['o resto é diferente de zero','o quociente é par','o dividendo é ímpar','o divisor é 1'],e:'17 ÷ 5 = 3 e sobra 2.'},
{s:'mat',t:'Divisão exata e não exata',q:'Em 17 ÷ 5, o quociente e o resto são:',o:['3 e 2','2 e 3','4 e 1','3 e 1'],e:'5 × 3 = 15; 17 − 15 = 2.'},
{s:'mat',t:'Divisão exata e não exata',q:'A prova real da divisão é:',o:['dividendo = divisor × quociente + resto','dividendo = divisor + quociente','divisor = dividendo × quociente','resto = quociente ÷ divisor'],e:'17 = 5 × 3 + 2. ✔'},
{s:'mat',t:'Divisão exata e não exata',q:'O resto de uma divisão é sempre:',o:['menor que o divisor','maior que o divisor','igual ao quociente','igual a zero'],e:'Se o resto ficasse maior ou igual ao divisor, ainda daria para dividir mais uma vez.'},
{s:'mat',t:'Divisão exata e não exata',q:'Em 100 ÷ 7, o quociente e o resto são:',o:['14 e 2','13 e 9','14 e 3','15 e 5'],e:'7 × 14 = 98; 100 − 98 = 2.'},
{s:'mat',t:'Divisão exata e não exata',q:'Quando a divisão de a por b é exata, podemos dizer que:',o:['a é múltiplo de b e b é divisor de a','a é divisor de b','a é primo','b é maior que a'],e:'12 ÷ 3 = 4: 12 é múltiplo de 3.'},
{s:'mat',t:'Divisão exata e não exata',q:'Qual destas divisões é exata?',o:['48 ÷ 6','50 ÷ 6','47 ÷ 6','49 ÷ 6'],e:'6 × 8 = 48, resto 0.'},
{s:'mat',t:'Divisão exata e não exata',q:'Em 25 ÷ 4, o resto é:',o:['1','2','3','0'],e:'4 × 6 = 24; 25 − 24 = 1.'},
{s:'mat',t:'Divisão exata e não exata',q:'Dividir um número por zero:',o:['não é possível','dá zero','dá o próprio número','dá 1'],e:'A divisão por zero não é definida na Matemática.'},
{s:'mat',t:'Divisão exata e não exata',q:'Numa divisão, o número que será dividido chama-se:',o:['dividendo','divisor','quociente','resto'],e:'Em 30 ÷ 5, o dividendo é 30 e o divisor é 5.'},
// --- Números primos e decomposição
{s:'mat',t:'Números primos e decomposição',q:'Um número primo é aquele que tem exatamente:',o:['dois divisores: o 1 e ele mesmo','um divisor só','três divisores','nenhum divisor'],e:'2, 3, 5, 7, 11...'},
{s:'mat',t:'Números primos e decomposição',q:'O número 1 é primo?',o:['Não, porque tem apenas um divisor','Sim, é o primeiro primo','Sim, porque só é divisível por 1','Depende do caso'],e:'Primo precisa de exatamente dois divisores diferentes.'},
{s:'mat',t:'Números primos e decomposição',q:'O único número primo PAR é:',o:['2','4','0','1'],e:'Todos os outros pares são divisíveis por 2 além de 1 e deles mesmos.'},
{s:'mat',t:'Números primos e decomposição',q:'Qual destes números é primo?',o:['17','15','21','27'],e:'15 = 3×5, 21 = 3×7, 27 = 3×9.'},
{s:'mat',t:'Números primos e decomposição',q:'Qual destes números é COMPOSTO?',o:['9','11','13','7'],e:'9 tem os divisores 1, 3 e 9.'},
{s:'mat',t:'Números primos e decomposição',q:'Os números primos menores que 20 são:',o:['2, 3, 5, 7, 11, 13, 17 e 19','1, 2, 3, 5, 7, 9','2, 4, 6, 8, 10','todos os ímpares até 19'],e:'São 8 números primos.'},
{s:'mat',t:'Números primos e decomposição',q:'A decomposição em fatores primos de 12 é:',o:['2² × 3','2 × 6','3 × 4','2 × 3²'],e:'12 = 2 × 2 × 3.'},
{s:'mat',t:'Números primos e decomposição',q:'A decomposição em fatores primos de 30 é:',o:['2 × 3 × 5','5 × 6','2 × 15','3 × 10'],e:'Todos os fatores precisam ser primos.'},
{s:'mat',t:'Números primos e decomposição',q:'A decomposição em fatores primos de 24 é:',o:['2³ × 3','2² × 6','4 × 6','2 × 12'],e:'24 = 2 × 2 × 2 × 3.'},
{s:'mat',t:'Números primos e decomposição',q:'A decomposição em fatores primos de 100 é:',o:['2² × 5²','10²','4 × 25','2 × 50'],e:'100 = 2 × 2 × 5 × 5.'},
{s:'mat',t:'Números primos e decomposição',q:'Para decompor um número em fatores primos, dividimos:',o:['pelos números primos, começando pelo menor possível','por qualquer número','sempre por 10','somente por 2'],e:'2, depois 3, depois 5, e assim por diante, até chegar a 1.'},
{s:'mat',t:'Números primos e decomposição',q:'O Crivo de Eratóstenes serve para:',o:['encontrar os números primos de uma lista','somar frações','fazer divisões exatas','calcular potências'],e:'Vai riscando os múltiplos de cada primo.'},
// --- Frações
{s:'mat',t:'Frações',q:'Na fração 3/4, o número 3 é o:',o:['numerador','denominador','quociente','resto'],e:'Numerador em cima, denominador embaixo.'},
{s:'mat',t:'Frações',q:'Na fração 3/4, o denominador indica:',o:['em quantas partes iguais o inteiro foi dividido','quantas partes foram tomadas','o resultado da divisão','o resto'],e:'O numerador indica quantas partes foram tomadas.'},
{s:'mat',t:'Frações',q:'Uma fração PRÓPRIA é aquela em que:',o:['o numerador é menor que o denominador','o numerador é maior que o denominador','o numerador é múltiplo do denominador','o denominador é 1'],e:'2/5 é própria, e vale menos que um inteiro.'},
{s:'mat',t:'Frações',q:'Uma fração IMPRÓPRIA é aquela em que:',o:['o numerador é maior ou igual ao denominador','o numerador é menor que o denominador','o denominador é zero','o numerador é 1'],e:'7/3 é imprópria, vale mais que um inteiro.'},
{s:'mat',t:'Frações',q:'Uma fração APARENTE é aquela em que:',o:['o numerador é múltiplo do denominador, resultando em um número inteiro','o numerador é 1','o denominador é ímpar','não dá para simplificar'],e:'8/4 = 2 e 6/3 = 2.'},
{s:'mat',t:'Frações',q:'A fração 5/5 é igual a:',o:['1','5','0','25'],e:'Numerador igual ao denominador = um inteiro.'},
{s:'mat',t:'Frações',q:'Qual fração é equivalente a 1/2?',o:['2/4','1/4','2/3','3/2'],e:'Multiplicando numerador e denominador pelo mesmo número, a fração não muda de valor.'},
{s:'mat',t:'Frações',q:'Simplificando 6/8 chegamos a:',o:['3/4','2/4','6/4','1/2'],e:'Dividindo os dois por 2.'},
{s:'mat',t:'Frações',q:'Simplificando 10/15 chegamos a:',o:['2/3','5/3','1/5','3/2'],e:'Dividindo os dois por 5.'},
{s:'mat',t:'Frações',q:'1/5 + 2/5 é igual a:',o:['3/5','3/10','2/5','3/25'],e:'Com o mesmo denominador, soma-se só os numeradores.'},
{s:'mat',t:'Frações',q:'Entre 3/7 e 5/7, a maior é:',o:['5/7','3/7','são iguais','não dá para comparar'],e:'Mesmo denominador: maior numerador, maior fração.'},
{s:'mat',t:'Frações',q:'Entre 1/3 e 1/8, a maior é:',o:['1/3','1/8','são iguais','depende do inteiro'],e:'Mesmo numerador: quanto MAIOR o denominador, menores são os pedaços.'},
{s:'mat',t:'Frações',q:'Um número misto (ou fração mista) é formado por:',o:['uma parte inteira e uma fração própria','duas frações próprias','um número primo e uma fração','uma fração e uma potência'],e:'Exemplo: 2 e 1/3.'},
{s:'mat',t:'Frações',q:'A fração imprópria 7/3 escrita como número misto é:',o:['2 e 1/3','3 e 1/2','1 e 2/3','2 e 3/1'],e:'7 ÷ 3 = 2, resto 1: quociente vira o inteiro e o resto vira o numerador.'},
{s:'mat',t:'Frações',q:'O número misto 2 e 1/4 escrito como fração imprópria é:',o:['9/4','7/4','21/4','3/4'],e:'2 × 4 = 8; 8 + 1 = 9; mantém o denominador 4.'},
{s:'mat',t:'Frações',q:'A fração imprópria 11/4 escrita como número misto é:',o:['2 e 3/4','3 e 1/4','2 e 1/4','1 e 3/4'],e:'11 ÷ 4 = 2, resto 3.'},
{s:'mat',t:'Frações',q:'Toda fração também pode ser entendida como:',o:['uma divisão entre o numerador e o denominador','uma multiplicação','uma potência','uma subtração'],e:'3/4 = 3 ÷ 4 = 0,75.'},

// ================================================================ CIÊNCIAS
// --- Cap. 3: Ser vivo e não vivo (p. 8)
{s:'cie',t:'Características dos seres vivos',q:'Sobre a definição de vida, a Ciência:',o:['ainda não tem uma resposta definitiva, mas identificou características comuns aos seres vivos','já definiu exatamente o que é a vida','considera que qualquer coisa que se move é viva','usa apenas o tamanho para definir'],e:'Por isso usamos uma lista de características.'},
{s:'cie',t:'Características dos seres vivos',q:'A CELULARIDADE significa que:',o:['todas as formas de vida conhecidas são organizadas em células, com exceção dos vírus','todos os seres vivos têm apenas uma célula','só os animais têm células','as células são visíveis a olho nu'],e:'Os vírus são a exceção: são acelulares.'},
{s:'cie',t:'Características dos seres vivos',q:'METABOLISMO é:',o:['o conjunto de reações químicas que mantêm o organismo vivo, como a digestão e a respiração','a capacidade de se reproduzir','a troca de material genético','o crescimento do corpo'],e:'Sem metabolismo, não há funcionamento do organismo.'},
{s:'cie',t:'Características dos seres vivos',q:'O material genético dos seres vivos é formado por:',o:['DNA e RNA','água e sais minerais','proteínas apenas','açúcares'],e:'Ele armazena as informações para a formação e o funcionamento do ser vivo.'},
{s:'cie',t:'Características dos seres vivos',q:'O CICLO DE VIDA indica que os seres vivos:',o:['nascem de outros seres vivos, desenvolvem-se, podem se reproduzir e morrem','vivem para sempre','surgem da matéria não viva','não mudam ao longo do tempo'],e:'É uma das características da vida.'},
{s:'cie',t:'Características dos seres vivos',q:'A NUTRIÇÃO é necessária porque:',o:['os seres vivos precisam de materiais e de energia para manter o funcionamento das células','serve apenas para o crescimento','só os animais precisam comer','substitui a respiração'],e:'Materiais e energia vêm dos processos de nutrição.'},
{s:'cie',t:'Características dos seres vivos',q:'A CAPACIDADE DE EVOLUÇÃO acontece quando:',o:['o material genético sofre alterações e os seres vivos se modificam naturalmente ao longo do tempo','um indivíduo decide mudar','o ambiente fica mais quente','a célula se divide'],e:'É uma mudança ao longo das gerações.'},
{s:'cie',t:'Características dos seres vivos',q:'"Percepção e resposta a estímulos" quer dizer que os seres vivos:',o:['percebem o ambiente e conseguem reagir a mudanças em seu entorno','só reagem quando são tocados','não sentem nada','apenas os animais percebem o ambiente'],e:'Plantas também respondem a estímulos, como a luz.'},
{s:'cie',t:'Características dos seres vivos',q:'Por que os vírus são um caso especial?',o:['Possuem características de seres vivos e de não vivos: não têm célula nem metabolismo próprio','São os menores seres vivos','São feitos de muitas células','Não possuem material genético'],e:'Por isso não se encaixam totalmente na definição de ser vivo.'},
{s:'cie',t:'Características dos seres vivos',q:'São exemplos de seres vivos citados no capítulo:',o:['bactéria, protozoário, planta, fungo e animal','apenas animais e plantas','vírus e cristais','rochas e água'],e:'A vida aparece em formas muito diferentes.'},
{s:'cie',t:'Características dos seres vivos',q:'A REPRODUÇÃO é a capacidade de:',o:['os seres vivos originarem outros seres vivos','crescer de tamanho','se alimentar','responder a estímulos'],e:'Garante a continuidade da espécie.'},
// --- Cap. 3: Abiogênese x Biogênese (p. 10 a 13)
{s:'cie',t:'Abiogênese × Biogênese',q:'A Teoria da ABIOGÊNESE defende que:',o:['os seres vivos se originavam de material não vivo (geração espontânea)','todo ser vivo vem de outro ser vivo','a vida veio do espaço','os seres vivos evoluem'],e:'Também chamada de geração espontânea.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'A Teoria da BIOGÊNESE defende que:',o:['um ser vivo só pode se originar de outro ser vivo','a vida surge da matéria inanimada','a vida precisa de um princípio vital','os seres vivos não se reproduzem'],e:'É a teoria aceita hoje.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'A ideia de geração espontânea remonta a povos antigos:',o:['da China, da Babilônia, da Grécia e do Egito','apenas da Europa moderna','das Américas','somente da Grécia'],e:'Aristóteles falava em "princípio vital".'},
{s:'cie',t:'Abiogênese × Biogênese',q:'Segundo Aristóteles, alguns seres podiam surgir da matéria não viva desde que ela contivesse:',o:['o "princípio vital"','oxigênio','água e sal','calor do Sol'],e:'Era o princípio necessário à vida, segundo ele.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'Jean Baptiste van Helmont defendeu a geração espontânea ao observar que:',o:['ratos surgiam em locais escuros e úmidos, onde ele deixou roupas suadas e grãos de trigo','moscas nasciam de ovos','micróbios apareciam no caldo','larvas vinham de outras larvas'],e:'Hoje sabemos que os ratos apenas se reproduziam ali por causa do alimento e do abrigo.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'Hoje se sabe que o surgimento dos ratos observado por van Helmont ocorria porque:',o:['o ambiente oferecia alimento e tecidos, criando condições para a reprodução e a sobrevivência deles','a matéria não viva virou rato','o trigo tinha princípio vital','as roupas geravam vida'],e:'Era um erro de interpretação do experimento.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'No experimento de Francesco Redi (1688), ele colocou pedaços de carne:',o:['em um pote aberto e em um pote fechado com gaze','em dois potes lacrados','em água fervente','ao Sol e à sombra'],e:'A gaze deixava o ar passar, mas impedia as moscas.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'O resultado do experimento de Redi foi:',o:['surgiram "vermes" na carne do pote aberto e não no pote coberto com gaze','surgiram vermes nos dois potes','não surgiram vermes em nenhum pote','a carne não estragou'],e:'No pote fechado, as moscas ficaram só sobrevoando a gaze.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'Redi concluiu que os "vermes" da carne eram, na verdade:',o:['larvas nascidas de ovos depositados pelas moscas','pedaços de carne transformados','micro-organismos do ar','seres criados pelo princípio vital'],e:'Isso fortaleceu a Teoria da Biogênese.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'Para propor seu experimento, Redi precisou conhecer:',o:['o ciclo de vida das moscas: ovo, larva, pupa e adulto','a estrutura da célula','os micro-organismos do ar','a temperatura da carne'],e:'Todo experimento parte de informações e de uma hipótese.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'No experimento de John Needham (1745), ele:',o:['ferveu caldos nutritivos, fechou os frascos com cortiça e, dias depois, encontrou micro-organismos','lacrou os frascos hermeticamente','usou frascos com pescoço de cisne','não ferveu os caldos'],e:'Ele concluiu (equivocadamente) que a abiogênese era verdadeira.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'Lazzaro Spallanzani (1770) refez o experimento de Needham. O que ele mudou?',o:['Ferveu por mais tempo e fechou os frascos hermeticamente, derretendo a ponta do vidro','Usou carne em vez de caldo','Deixou os frascos abertos','Não ferveu nada'],e:'Ele desconfiava da vedação frágil da cortiça.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'O resultado obtido por Spallanzani foi:',o:['não surgiram micro-organismos nos frascos hermeticamente fechados','surgiram mais micro-organismos','os frascos explodiram','o caldo evaporou'],e:'Ele concluiu que a Teoria da Biogênese era verdadeira.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'Needham rebateu Spallanzani dizendo que:',o:['a fervura excessiva acabaria com a "força vital", impedindo a geração espontânea','o vidro estava sujo','o caldo era fraco','o tempo foi curto demais'],e:'Por isso a controvérsia continuou por mais tempo.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'"Força vital" era a ideia de que:',o:['um tipo de energia seria responsável pela vida e pelo surgimento dos seres vivos','o ar continha micro-organismos','o calor gerava vida','o caldo tinha nutrientes'],e:'Era o argumento dos defensores da abiogênese.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'Por volta de 1860, quem resolveu definitivamente a controvérsia?',o:['Louis Pasteur','Robert Hooke','Aristóteles','van Helmont'],e:'Pasteur (1822-1895) descartou a abiogênese.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'O experimento de Pasteur usou frascos:',o:['com um longo gargalo curvado, chamado "pescoço de cisne"','totalmente lacrados','abertos e sujos','com tampa de cortiça'],e:'O formato foi a chave do experimento.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'A vantagem do "pescoço de cisne" era permitir que:',o:['o ar entrasse em contato com o caldo, mas nenhuma partícula presente nele chegasse até o líquido','o vapor não saísse','o caldo esfriasse mais rápido','a luz entrasse'],e:'Assim os defensores da abiogênese não podiam alegar falta de ar ou de força vital.'},
{s:'cie',t:'Abiogênese × Biogênese',q:'No experimento de Pasteur, se o gargalo do frasco fosse quebrado:',o:['surgiam micro-organismos no caldo','nada acontecia','o caldo ficava estéril para sempre','o caldo congelava'],e:'Prova de que a contaminação vinha do ar, e não da geração espontânea.'},

// ===== ENGINE =====
const $=id=>document.getElementById(id);
let cur={s:null,t:null}, deck=[], idx=0, hits=0, misses=[];

function go(screen){
  ['menu','topics','quiz','end'].forEach(s=>$(s).classList.toggle('hide',s!==screen));
  if(screen==='menu')renderMenu();
  window.scrollTo(0,0);
}
// ponytail: localStorage falha em file:/data: URLs; memória volátil serve de fallback
const key=(s,t)=>'pg:'+s+':'+(t||'*');
const mem={};
const best=(s,t)=>{try{return +(localStorage.getItem(key(s,t))||0)}catch(e){return mem[key(s,t)]||0}};
const saveBest=(s,t,v)=>{try{localStorage.setItem(key(s,t),v)}catch(e){mem[key(s,t)]=v}};

function renderMenu(){
  $('subjects').innerHTML=SUBJECTS.map(s=>{
    const n=Q.filter(q=>q.s===s.id).length, b=best(s.id,null);
    return `<div class="card" onclick="openSubject('${s.id}')">
      <span class="ico">${s.ico}</span>
      <span><b>${s.nome}</b><small>${n} questões</small></span>
      ${b?`<span class="best">🏆 ${b}%</span>`:''}</div>`;
  }).join('');
}

function openSubject(sid){
  cur={s:sid,t:null};
  const subj=SUBJECTS.find(s=>s.id===sid);
  $('tTitle').textContent=subj.ico+' '+subj.nome;
  const topics=[...new Set(Q.filter(q=>q.s===sid).map(q=>q.t))];
  $('topicList').innerHTML=
    `<div class="card" onclick="startQuiz('${sid}',null)">
       <span class="ico">🎲</span><span><b>Tudo misturado</b><small>sorteia de todos os assuntos</small></span>
       ${best(sid,null)?`<span class="best">🏆 ${best(sid,null)}%</span>`:''}</div>`
    + topics.map(t=>{
      const n=Q.filter(q=>q.s===sid&&q.t===t).length, b=best(sid,t);
      return `<div class="card" onclick="startQuiz('${sid}',${JSON.stringify(t).replace(/"/g,'&quot;')})">
        <span class="ico">▸</span><span><b>${t}</b><small>${n} questões</small></span>
        ${b?`<span class="best">🏆 ${b}%</span>`:''}</div>`;
    }).join('');
  go('topics');
}

const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function startQuiz(sid,topic){
  cur={s:sid,t:topic};
  const pool=Q.filter(q=>q.s===sid&&(!topic||q.t===topic));
  deck=shuffle(pool).slice(0,10);
  idx=0;hits=0;misses=[];
  go('quiz');showQ();
}

function showQ(){
  const q=deck[idx];
  $('qWhere').textContent=`Questão ${idx+1}/${deck.length}`;
  $('qScore').textContent=`✅ ${hits}`;
  $('qBar').style.width=(idx/deck.length*100)+'%';
  $('qTag').textContent=q.t;
  $('qText').textContent=q.q;
  $('qFb').innerHTML='';
  $('qNext').classList.add('hide');
  const correct=q.o[0];
  $('qOpts').innerHTML=shuffle(q.o).map(o=>
    `<button class="opt">${o}</button>`).join('');
  [...$('qOpts').children].forEach(b=>b.onclick=()=>answer(b,b.textContent===correct,correct,q));
}

function answer(btn,right,correct,q){
  [...$('qOpts').children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct)b.classList.add('ok');
  });
  if(right){hits++;}
  else{btn.classList.add('no');misses.push({q:q.q,a:correct,e:q.e});}
  $('qScore').textContent=`✅ ${hits}`;
  $('qFb').innerHTML=`<div class="fb ${right?'ok':'no'}">
    <b>${right?'✅ Isso aí!':'❌ Resposta: '+correct}</b><br>${q.e}</div>`;
  $('qNext').classList.remove('hide');
  $('qNext').onclick=()=>{idx++;idx<deck.length?showQ():finish()};
}

function finish(){
  const pct=Math.round(hits/deck.length*100);
  if(pct>best(cur.s,cur.t))saveBest(cur.s,cur.t,pct);
  $('eTitle').textContent=pct===100?'🏆 Gabaritou!':pct>=70?'🎉 Muito bem!':'💪 Bora treinar mais!';
  $('eScore').textContent=hits+'/'+deck.length+' ('+pct+'%)';
  $('eMsg').textContent=pct>=70?'Esse assunto tá dominado.':'Revise os erros abaixo e jogue de novo.';
  $('eRev').innerHTML=misses.length
    ? '<h3 style="margin-bottom:8px">Para revisar:</h3>'+misses.map(m=>
        `<div class="rev"><b>${m.q}</b><br>✅ ${m.a}<br><i>${m.e}</i></div>`).join('')
    : '';
  go('end');
}

renderMenu();
</script>
